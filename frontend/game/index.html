<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skybloom Tower Defense - Game Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Concert+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #game-container canvas {
      display: block;
      margin: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.05);
    }
    @keyframes correctPulse {
      0% {
        transform: scale(1.0);
        filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.6)) brightness(1.1);
      }
      50% {
        transform: scale(1.06);
        filter: drop-shadow(0 0 24px rgba(34, 197, 94, 0.95)) brightness(1.3);
      }
      100% {
        transform: scale(1.0);
        filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.6)) brightness(1.1);
      }
    }
    @keyframes incorrectPulse {
      0% {
        transform: scale(1.0);
        filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6)) brightness(1.1);
      }
      50% {
        transform: scale(1.06);
        filter: drop-shadow(0 0 24px rgba(239, 68, 68, 0.95)) brightness(1.3);
      }
      100% {
        transform: scale(1.0);
        filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6)) brightness(1.1);
      }
    }
    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.15);
      border-top: 6px solid #38bdf8;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
