<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Skybloom Tower Defense - Game Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Concert+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    /* Enforce rigid full screen on html and body to prevent scrolling & address bar offsets */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      overscroll-behavior: none;
      background-color: #0a0e17;
      color: #ffffff;
      font-family: 'Concert One', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      z-index: 1;
    }
    
    #game-container canvas {
      display: block;
      margin: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.05);
    }
    

    
    /* Elegant text-only portrait warning overlay */
    #portrait-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      background: linear-gradient(135deg, #090d16 0%, #111827 100%);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    
    .warning-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 440px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    
    .warning-card h1 {
      font-size: 2rem;
      margin: 0 0 16px 0;
      color: #fb923c; /* Premium warm orange */
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 4px 12px rgba(251, 146, 60, 0.25);
    }
    
    .warning-card p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #94a3b8;
      margin: 0;
    }
    
    @keyframes correctPulse {
      0% {
        transform: scale(1.0);
        filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.6)) brightness(1.1);
      }
      50% {
        transform: scale(1.06);
        filter: drop-shadow(0 0 24px rgba(34, 197, 94, 0.95)) brightness(1.3);
      }
      100% {
        transform: scale(1.0);
        filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.6)) brightness(1.1);
      }
    }
    @keyframes incorrectPulse {
      0% {
        transform: scale(1.0);
        filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6)) brightness(1.1);
      }
      50% {
        transform: scale(1.06);
        filter: drop-shadow(0 0 24px rgba(239, 68, 68, 0.95)) brightness(1.3);
      }
      100% {
        transform: scale(1.0);
        filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6)) brightness(1.1);
      }
    }
    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.15);
      border-top: 6px solid #38bdf8;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script type="module" crossorigin src="/game/assets/index-BYwAWNm6.js"></script>
</head>
<body>
  <!-- Clean glassmorphic overlay for orientation locking -->
  <div id="portrait-overlay">
    <div class="warning-card">
      <h1>Rotate Your Device</h1>
      <p>Please rotate your device to landscape mode to play Skybloom TD.</p>
    </div>
  </div>

  <div id="game-container"></div>
  
  <script>
    (function() {
      // Robust check for mobile or tablet user agents
      function isMobileOrTablet() {
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const mobileRegex = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i;
        if (mobileRegex.test(userAgent.toLowerCase())) {
          return true;
        }
        // Support iPadOS desktop request mode
        if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) {
          return true;
        }
        // Touch screens with coarse pointer devices
        const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;
        return hasTouch && isCoarsePointer;
      }

      function checkOrientation() {
        const overlay = document.getElementById('portrait-overlay');
        const container = document.getElementById('game-container');
        
        if (isMobileOrTablet()) {
          // If screen height is strictly greater than width, we are in portrait
          if (window.innerHeight > window.innerWidth) {
            overlay.style.display = 'flex';
          } else {
            overlay.style.display = 'none';
          }
        } else {
          // Desktop play is fully allowed and unblocked
          overlay.style.display = 'none';
        }
      }

      // Perform checking on DOM load and register viewport size listeners
      window.addEventListener('DOMContentLoaded', () => {
        checkOrientation();
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
      });
    })();
  </script>
  
</body>
</html>
