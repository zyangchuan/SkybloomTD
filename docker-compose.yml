name: skybloom-services

services:
  reverse-proxy:
    container_name: reverse-proxy
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs:/usr/share/nginx/html/docs:ro
    depends_on:
      - frontend
      - game
      - user-service
      - document-content-api
      - game-service
      - game-generation-worker
      - rabbitmq
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - \"$${NGINX_HEALTHCHECK_URL}\" | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      NGINX_HEALTHCHECK_URL: ${NGINX_HEALTHCHECK_URL}
    networks:
      - services-network

  frontend:
    container_name: frontend
    image: skybloomtd-frontend:latest
    build:
      context: ./frontend/app
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SUPABASE_REDIRECT_URL: ${NEXT_PUBLIC_SUPABASE_REDIRECT_URL}
    restart: unless-stopped
    networks:
      - services-network

  game:
    container_name: game
    image: skybloomtd-game:latest
    build:
      context: ./frontend/game
    expose:
      - "5173"
    restart: unless-stopped
    networks:
      - services-network

  document-content-api:
    container_name: document-content-api
    build:
      context: ./services/document-content/src/api
      dockerfile: Dockerfile
    image: document-content-api:latest
    expose:
      - "8000"
    volumes:
      - ./services/document-content/temp:/temp
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - services-network

  document-content-grpc:
    container_name: document-content-grpc
    build:
      context: ./services/document-content/src/grpc
      dockerfile: Dockerfile
    image: document-content-grpc:latest
    expose:
      - "50051"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50051"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - services-network

  game-service:
    container_name: game-service
    build:
      context: ./services/game-service/src
      dockerfile: Dockerfile
      target: dev
    image: game-service:latest
    volumes:
      - ./services/game-service/src:/app
    expose:
      - "8081"
    environment:
      GAME_SERVICE_PORT: 8081
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      game-redis:
        condition: service_started
    networks:
      - services-network

  game-generation-worker:
    container_name: game-generation-worker
    hostname: game-generation-worker
    build:
      context: ./services/game-service/src
      dockerfile: Dockerfile.worker
    image: game-generation-worker:latest
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      document-content-grpc:
        condition: service_healthy
      game-redis:
        condition: service_started
    networks:
      - services-network

  rabbitmq:
    container_name: rabbitmq
    hostname: rabbitmq
    image: rabbitmq:3-management-alpine
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - services-network

  redis:
    container_name: redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - services-network

  game-redis:
    container_name: game-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - game-redis-data:/data
    restart: unless-stopped
    networks:
      - services-network

  user-service:
    container_name: user-service
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    image: user-service:latest
    expose:
      - "8080"
    environment:
      USER_SERVICE_PORT: 8080
      GIN_MODE: release
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      ALLOW_UNVERIFIED_JWT: ${ALLOW_UNVERIFIED_JWT}
      AUTH_ACCESS_TOKEN_COOKIE: ${AUTH_ACCESS_TOKEN_COOKIE}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    networks:
      - services-network

networks:
  services-network:
    name: skybloom-services-network

volumes:
  rabbitmq-data:
  redis-data:
  game-redis-data:
