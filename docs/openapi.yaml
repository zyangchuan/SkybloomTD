openapi: 3.1.0
info:
  title: SkyBloomTD Edge API
  version: 0.1.0
  description: |
    Public API exposed through the Nginx reverse proxy.

    The root Docker Compose stack publishes only the reverse proxy on port 80.
    Backend services are private Docker-network services and should be accessed
    through these paths. Local, dev, staging, and production profiles are
    selected with a single root env file plus the matching compose override.
    RabbitMQ and Redis run as private Compose services in every root profile; service code connects to them through fixed Compose hostnames.

    Protected backend routes require a Supabase JWT stored in the
    `skybloom_access_token` cookie. Nginx verifies the cookie through
    `user-service /auth/verify` and forwards trusted identity headers to
    private services.
servers:
  - url: "{publicBaseUrl}"
    description: Public reverse proxy base URL
    variables:
      publicBaseUrl:
        default: http://localhost
tags:
  - name: System
    description: Public health and documentation endpoints.
  - name: Auth
    description: Authentication verification endpoints.
  - name: Users
    description: User profile persistence backed by `private.users`.
  - name: Document Content
    description: PDF/document upload and OCR workflow entrypoints.
  - name: Game Library
    description: Shared public game library, visibility, and starred-game endpoints.
  - name: Game Service
    description: Authoritative game websocket and level generation workflow.

paths:
  /nginx-health:
    get:
      tags: [System]
      summary: Check reverse proxy health
      operationId: getNginxHealth
      security: []
      responses:
        "200":
          description: Reverse proxy is healthy.
          content:
            text/plain:
              schema:
                type: string
              example: ok

  /openapi.yaml:
    get:
      tags: [System]
      summary: Download this OpenAPI document
      operationId: getOpenApiDocument
      security: []
      responses:
        "200":
          description: OpenAPI YAML document.
          content:
            application/yaml:
              schema:
                type: string

  /docs:
    get:
      tags: [System]
      summary: Open Swagger UI
      operationId: getSwaggerUi
      security: []
      responses:
        "200":
          description: Swagger UI HTML page.
          content:
            text/html:
              schema:
                type: string

  /api/user-service/health:
    get:
      tags: [System]
      summary: Check user-service process health
      operationId: getUserServiceHealth
      security: []
      responses:
        "200":
          description: Service process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/user-service/ready:
    get:
      tags: [System]
      summary: Check user-service database readiness
      operationId: getUserServiceReadiness
      security: []
      responses:
        "200":
          description: Service can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/user-service/auth/verify:
    get:
      tags: [Auth]
      summary: Verify the authentication cookie
      description: |
        Stateless Supabase token verification endpoint used by Nginx
        `auth_request`. Clients generally do not need to call this directly.
      operationId: verifySupabaseJwt
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Authentication cookie is valid.
          headers:
            X-User-Id:
              description: Authenticated Supabase user id from the JWT `sub` claim.
              schema:
                type: string
                format: uuid
            X-User-Email:
              description: User email from the JWT, when present.
              schema:
                type: string
                format: email
        "401":
          description: Authentication cookie is missing, invalid, expired, or misconfigured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users:
    post:
      tags: [Users]
      summary: Create or update the authenticated user profile
      description: |
        Stores the authenticated Supabase user in `private.users`. The database
        user id is always taken from the JWT `sub` claim in the authentication
        cookie. If `id` is included in the body, it must match the JWT subject.
      operationId: upsertUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserRequest"
            example:
              user_name: Ada
              email: ada@example.com
              metadata:
                avatar_url: https://example.com/avatar.png
      responses:
        "200":
          description: User profile was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request body id does not match authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get a user profile by id
      description: Returns a stored user profile from `private.users` by Supabase user id.
      operationId: getUserById
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Supabase user id stored in `private.users.id`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User profile was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: User id is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User profile was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/me:
    post:
      tags: [Users]
      summary: Create or update the authenticated user profile
      description: Alias of `POST /api/users`.
      operationId: upsertCurrentUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserRequest"
      responses:
        "200":
          description: User profile was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request body id does not match authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/upload-file:
    post:
      tags: [Document Content]
      summary: Upload a document for OCR and indexing
      description: |
        Shortcut route for `POST /api/document-content/upload-file`.

        The authenticated user id is taken from the Supabase JWT stored in the
        authentication cookie. Do not send a `user_id` field; client-supplied
        user ids are ignored by the backend.
      operationId: uploadDocumentShortcut
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadDocumentRequest"
      responses:
        "200":
          description: OCR/indexing workflow was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDocumentResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid multipart upload, missing `file`/`game_name` field, or multipart request exceeds the 50 MiB backend limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Multipart upload exceeds the 100 MB reverse-proxy limit.
        "500":
          description: Source storage or document row creation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Task status recording or RabbitMQ enqueue failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/health:
    get:
      tags: [Document Content]
      summary: Check document-content API process health through the protected proxy route
      operationId: getDocumentContentHealth
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Document-content API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/upload-file:
    post:
      tags: [Document Content]
      summary: Upload a document for OCR and indexing
      description: |
        Queues the OCR/indexing workflow. The API creates a durable document
        row immediately with `is_ready = false`, stores the main task status in
        Redis as `queued`, and publishes the worker job to RabbitMQ.
      operationId: uploadDocument
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadDocumentRequest"
      responses:
        "200":
          description: OCR/indexing workflow was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDocumentResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid multipart upload, missing `file`/`game_name` field, or multipart request exceeds the 50 MiB backend limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Multipart upload exceeds the 100 MB reverse-proxy limit.
        "500":
          description: Source storage or document row creation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Task status recording or RabbitMQ enqueue failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/documents:
    get:
      tags: [Document Content]
      summary: List current user's documents
      description: |
        Returns durable document rows for the authenticated user. Each item
        includes `is_ready` for durable usability and `task_id` for polling
        temporary Redis task status while processing is still in progress.
      operationId: listCurrentUserDocuments
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user's documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDocumentsResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/documents/{document_id}:
    delete:
      tags: [Document Content]
      summary: Delete a document and generated content
      description: |
        Deletes a document owned by the authenticated user. The service removes
        S3/local document assets, generated quizzes/levels for the document,
        document chunks/sections, and the document row.
      operationId: deleteDocument
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Document and generated content were deleted.
        "400":
          description: Invalid document id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Asset deletion or database deletion failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/documents/{document_id}/visibility:
    patch:
      tags: [Game Library]
      summary: Toggle a game's public visibility
      description: |
        Updates the authenticated user's game visibility. Games are public by
        default when uploaded. Only the document owner can change visibility.
        Private games are hidden from other users' library and starred-game
        lists, while public ready games can be listed and played by others.
      operationId: updateDocumentVisibility
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVisibilityRequest"
            example:
              is_public: false
      responses:
        "200":
          description: Visibility was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
        "400":
          description: Invalid document id or request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database update failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/documents/{document_id}/chapters:
    get:
      tags: [Document Content]
      summary: List chapters for a document
      description: |
        Returns indexed chapters for a document owned by the authenticated user
        or for a public ready game owned by another user. A document that is
        not ready yet may return an empty chapter list for its owner.
      operationId: listDocumentChapters
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document chapters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChaptersResponse"
        "400":
          description: Invalid document id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document was not found or is private to another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/chapters/{chapter_id}/sub-chapters:
    get:
      tags: [Document Content]
      summary: List sub-chapters for a chapter
      description: Returns indexed sub-chapters for a chapter owned by the authenticated user or from a public ready game.
      operationId: listChapterSubChapters
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: Chapter sub-chapters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSubChaptersResponse"
        "400":
          description: Invalid chapter id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Chapter was not found or belongs to a private game owned by another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/library/games:
    get:
      tags: [Game Library]
      summary: List public games
      description: |
        Returns ready games whose owners have left them public. Results are
        cursor-paginated with a fixed page size of 10.
      operationId: listPublicGames
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Public game library page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGameLibraryResponse"
        "400":
          description: Invalid cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/library/starred:
    get:
      tags: [Game Library]
      summary: List games starred by the current user
      description: |
        Returns games the authenticated user has starred. A game is included
        when it is owned by the authenticated user, or when it is public and
        ready. Results are cursor-paginated with a fixed page size of 10.
      operationId: listStarredGames
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Starred game page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGameLibraryResponse"
        "400":
          description: Invalid cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/library/games/{document_id}/star:
    post:
      tags: [Game Library]
      summary: Star a game
      description: |
        Saves a game to the authenticated user's starred list. The operation is
        idempotent. Users can star their own games, or games that are public
        and ready.
      operationId: starGame
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Game is starred.
        "400":
          description: Invalid document id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game was not found or is not available to star.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database write failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Game Library]
      summary: Unstar a game
      description: Removes a game from the authenticated user's starred list. The operation is idempotent.
      operationId: unstarGame
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Game is no longer starred.
        "400":
          description: Invalid document id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database write failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/tasks/{task_id}/status:
    get:
      tags: [Document Content]
      summary: Get document processing task status
      description: |
        Reads the temporary Redis task status for a document processing job.
        Status records expire after the configured task-status TTL, which is
        seven days by default. If the Redis key has expired, use the document
        `is_ready` flag as the durable readiness signal.
      operationId: getDocumentTaskStatus
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task status was found in Redis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task status was not found or has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Redis status lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/game-service/health:
    get:
      tags: [Game Service]
      summary: Check game-service process health through the protected proxy route
      operationId: getGameServiceHealth
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Game-service process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/game-service/ready:
    get:
      tags: [Game Service]
      summary: Check game-service database readiness through the protected proxy route
      operationId: getGameServiceReadiness
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Game-service can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/game-service/quiz-mistakes:
    get:
      tags: [Game Service]
      summary: List quiz mistakes for a level
      description: |
        Returns the authenticated user's saved incorrect quiz answers for the
        requested level. This endpoint is intended for frontend mistake-summary
        views after or during a game session.
      operationId: listGameQuizMistakes
      security:
        - cookieAuth: []
      parameters:
        - name: level_id
          in: query
          required: true
          description: Completed level id to summarize mistakes for.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Mistake summary for the requested level.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizMistakeSummary"
        "400":
          description: Missing or invalid level id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Mistake summary dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/game-service/ws:
    get:
      tags: [Game Service]
      summary: Open the authoritative game websocket
      description: |
        WebSocket endpoint for the game client. Browser clients should connect
        to the websocket base URL from `SKYBLOOM_PUBLIC_WS_BASE_URL` with
        `/api/game-service/ws` appended. Authentication is supplied by the `skybloom_access_token`
        cookie.

        After the connection opens, send `game.start` with a `sub_chapter_id`.
        The server responds with `level_generation.started`, including a
        `generation_id` and `status_url`. Poll the status URL until generation
        is complete, then send `game.load` with the returned `level_id` to
        receive `game.initial_state`. The initial state exposes only map data;
        quiz answer data stays server-side in the dedicated game Redis cache.
        To create the gameplay session, send `game.session.start` with the
        completed `level_id`. The server initializes a Redis-backed session
        with `health=100`, `essence=100`, `wave=0`, and
        `loop_started=false` and `loop_paused=false`, then returns
        `game.session.started` with the available bird type stats. To begin
        authoritative gameplay, send `game.session.run`; the 20 Hz gameplay
        ticker starts after that message.
        During the session, clients can send `game.action.place_tower` with a
        base `bird_type` and grid `x`/`y`, send `game.action.merge_tower` with
        compatible source and target bird ids to create hybrid birds, send
        `game.action.use_consumable` to deploy a ready Airstrike against three
        map targets, or send `game.pause` to persist `loop_paused=true` and stop
        advancing ticks until a later resume flow is added. The client controls
        the Airstrike animation and sends `game.action.use_consumable` at impact;
        the server then validates availability and targets, consumes the charge,
        applies damage immediately. The result is included in subsequent
        `game.state` snapshots; no success-specific reply is sent.
        Hybrid bird types are returned in the catalog and state snapshots, but
        cannot be placed directly.
        Reconnecting with the same `level_id` reuses the existing Redis session
        for that user and level, including placed birds, active smogs, health,
        wave, tick, current essence, loop start state, and pause state, until
        the session expires. Consumable inventory and pending consumable
        deployments are also restored. The gameplay loop runs five
        enemy waves, each split into grouped spawns. The first
        wave starts
        on the first gameplay tick after the session starts, and each later
        wave starts three seconds after the previous wave has been cleared. Map
        generation keeps the enemy path out of the top two and bottom two
        rows so UI overlays do not cover it. Each smog that reaches the path
        end removes 10 health. When health reaches 0, the server stops the loop
        and sends `game.over`. When all five waves are cleared with health
        remaining, the server stops the loop and sends `game.victory`. Clients
        can send `game.exit` to stop the running loop
        and delete the Redis gameplay session and level quiz cache; cached
        maps are left to expire by TTL. This lets play-again repopulate the
        full quiz set from PostgreSQL. During a running session, clients can
        send `game.quiz.request` to receive one quiz prompt without answer
        data, then send `game.quiz.answer` with the selected option index.
        Starting a fresh quiz has a 20 second cooldown. Re-requesting the
        currently pending unanswered quiz is allowed immediately.
        To acquire an Airstrike, send `game.consumable.acquire` with
        `item_type=airstrike`. The server presents a consumable quiz with
        `game.consumable.quiz.presented`; answering correctly with
        `game.consumable.quiz.answer` grants one ready Airstrike instead of
        essence. Progression quizzes and consumable acquisition quizzes cannot
        be pending at the same time.
        Quiz requests before `game.session.run` return `game.quiz.unavailable`
        with `reason=game_not_started`. Correct answers award 50 essence;
        incorrect answers are saved for a later mistakes summary. Answered
        quizzes are removed from Redis.

        If the database already has quizzes for the authenticated user's
        sub-chapter, the service reuses the saved level instead of generating
        a new quiz set. New quiz generations request exactly 30 quizzes. Quiz
        answer data is copied into the dedicated game Redis cache for
        authoritative validation during play.

        For chapter-level free play, send `game.freeplay.start` with a
        `chapter_id`. The server generates a fresh map, creates a chapter-scoped
        quiz cache containing up to 15 randomly selected quizzes from ready
        sub-chapter levels in that chapter, and queues normal sub-chapter level
        generation for missing quiz sources. The server replies with
        `freeplay.started`. When `status=ready`, send `game.freeplay.load` with
        the returned `free_play_id` to receive `game.initial_state`, then send
        `game.freeplay.session.start` with `free_play_id` and `chapter_id` to
        create the gameplay session. Free play uses `game_mode=free_play`, has
        no victory state, and continues generating increasingly difficult waves
        until health reaches 0 or the client exits. When its active quiz cache
        gets low, the server refills it from random ready sub-chapter quizzes
        and keeps queueing generation for missing sub-chapter levels.
      operationId: openGameWebSocket
      security:
        - cookieAuth: []
      x-websocket-client-messages:
        - $ref: "#/components/schemas/GameStartWebSocketMessage"
        - $ref: "#/components/schemas/GameFreePlayStartWebSocketMessage"
        - $ref: "#/components/schemas/GameLoadWebSocketMessage"
        - $ref: "#/components/schemas/GameFreePlayLoadWebSocketMessage"
        - $ref: "#/components/schemas/GameSessionStartWebSocketMessage"
        - $ref: "#/components/schemas/GameFreePlaySessionStartWebSocketMessage"
        - $ref: "#/components/schemas/GameSessionRunWebSocketMessage"
        - $ref: "#/components/schemas/GamePlaceTowerActionMessage"
        - $ref: "#/components/schemas/GameMergeTowerActionMessage"
        - $ref: "#/components/schemas/GameUseConsumableActionMessage"
        - $ref: "#/components/schemas/GamePauseWebSocketMessage"
        - $ref: "#/components/schemas/GameExitWebSocketMessage"
        - $ref: "#/components/schemas/GameQuizRequestMessage"
        - $ref: "#/components/schemas/GameQuizAnswerMessage"
        - $ref: "#/components/schemas/GameConsumableAcquireMessage"
        - $ref: "#/components/schemas/GameConsumableQuizAnswerMessage"
      x-websocket-server-messages:
        - $ref: "#/components/schemas/LevelGenerationStartedMessage"
        - $ref: "#/components/schemas/FreePlayStartedMessage"
        - $ref: "#/components/schemas/GameInitialStateMessage"
        - $ref: "#/components/schemas/GameSessionStartedMessage"
        - $ref: "#/components/schemas/GameStateMessage"
        - $ref: "#/components/schemas/GameOverMessage"
        - $ref: "#/components/schemas/GameVictoryMessage"
        - $ref: "#/components/schemas/GamePausedMessage"
        - $ref: "#/components/schemas/GameExitedMessage"
        - $ref: "#/components/schemas/GameQuizPresentedMessage"
        - $ref: "#/components/schemas/GameQuizResultMessage"
        - $ref: "#/components/schemas/GameQuizUnavailableMessage"
        - $ref: "#/components/schemas/GameConsumableQuizPresentedMessage"
        - $ref: "#/components/schemas/GameConsumableQuizResultMessage"
        - $ref: "#/components/schemas/GameActionAcceptedMessage"
        - $ref: "#/components/schemas/GameActionRejectedMessage"
        - $ref: "#/components/schemas/GameErrorMessage"
      responses:
        "101":
          description: WebSocket upgrade accepted.
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/game-service/level-generation/{generation_id}/status:
    get:
      tags: [Game Service]
      summary: Get level generation status
      description: |
        Poll this short-lived Redis-backed status after the websocket
        `game.start` response. If Redis status has expired but the level was
        completed, the server reconstructs a complete status from the durable
        generation row.
      operationId: getGameLevelGenerationStatus
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/GenerationId"
      responses:
        "200":
          description: Current generation status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LevelGenerationStatus"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Generation was not found, belongs to another user, or status has expired before completion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Generation status dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: skybloom_access_token

  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      description: Main document processing task id returned by upload.
      schema:
        type: string
        pattern: "^[a-f0-9]{32}$"
    DocumentId:
      name: document_id
      in: path
      required: true
      description: Document id returned by upload or document listing.
      schema:
        type: string
        format: uuid
    ChapterId:
      name: chapter_id
      in: path
      required: true
      description: Chapter id returned by the document chapters endpoint.
      schema:
        type: string
        format: uuid
    GenerationId:
      name: generation_id
      in: path
      required: true
      description: Level generation id returned by the `level_generation.started` websocket message.
      schema:
        type: string
        pattern: "^[a-f0-9]{32}$"
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor returned as `next_cursor` from the previous page.
      schema:
        type: string

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ready

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: authentication required

    FastApiValidationError:
      type: object
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true

    UpsertUserRequest:
      type: object
      required: [user_name]
      properties:
        id:
          type: string
          format: uuid
          description: Optional. If provided, must match the authenticated JWT `sub` claim.
        email:
          type: string
          format: email
        user_name:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties: true

    User:
      type: object
      required: [id, user_name, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        user_name:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UploadDocumentRequest:
      type: object
      required: [file, game_name]
      properties:
        file:
          type: string
          format: binary
          description: PDF document to OCR. The multipart request must be no larger than 50 MiB; PDFs are expected by the current worker flow.
        game_name:
          type: string
          maxLength: 120
          description: User-facing game name generated from this document.
          example: Linear Algebra TD

    UploadDocumentResponse:
      type: object
      required:
        - message
        - task_id
        - user_id
        - document_id
        - game_name
        - is_ready
        - is_public
      properties:
        message:
          type: string
          example: Upload file success
        task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
          description: Main document processing task id. Poll this id through the task status endpoint.
        user_id:
          type: string
          format: uuid
          description: Authenticated Supabase user id from the authenticated JWT.
        document_id:
          type: string
          format: uuid
          description: Generated document id. The document row exists immediately with `is_ready = false`.
        game_name:
          type: string
          description: User-facing game name stored on the document row.
          example: Linear Algebra TD
        is_ready:
          type: boolean
          description: Durable document readiness flag. It is `false` until indexing succeeds.
          example: false
        is_public:
          type: boolean
          description: Public visibility flag. New games are public by default.
          example: true

    ListDocumentsResponse:
      type: object
      required:
        - documents
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSummary"

    DocumentSummary:
      type: object
      required:
        - document_id
        - source_filename
        - game_name
        - is_ready
        - is_public
        - task_id
        - created_at
        - updated_at
      properties:
        document_id:
          type: string
          format: uuid
        source_filename:
          type: string
          example: lesson.pdf
        game_name:
          type: string
          example: Linear Algebra TD
        is_ready:
          type: boolean
          description: Durable document readiness flag. `true` only after indexing succeeds.
        is_public:
          type: boolean
          description: Whether this game appears in the shared public library once ready.
        task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
          description: Main document processing task id.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateVisibilityRequest:
      type: object
      required: [is_public]
      properties:
        is_public:
          type: boolean
          description: Set to `true` to make the game public, or `false` to make it private.

    ListGameLibraryResponse:
      type: object
      required:
        - games
      properties:
        games:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/GameLibrarySummary"
        next_cursor:
          type: string
          description: Opaque cursor for the next page. Omitted when there are no more results.

    GameLibrarySummary:
      type: object
      required:
        - document_id
        - user_id
        - source_filename
        - game_name
        - is_ready
        - is_public
        - starred_by_me
        - created_at
        - updated_at
      properties:
        document_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: Owner id for the game.
        source_filename:
          type: string
          example: lesson.pdf
        game_name:
          type: string
          example: Linear Algebra TD
        is_ready:
          type: boolean
          description: Durable game readiness flag.
          example: true
        is_public:
          type: boolean
          description: Public visibility flag.
          example: true
        starred_by_me:
          type: boolean
          description: Whether the authenticated user has starred this game.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListChaptersResponse:
      type: object
      required:
        - chapters
      properties:
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/ChapterSummary"

    ChapterSummary:
      type: object
      required:
        - chapter_id
        - document_id
        - chapter_index
        - title
        - start_line
        - end_line
        - created_at
      properties:
        chapter_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        chapter_index:
          type:
            - integer
            - "null"
        title:
          type:
            - string
            - "null"
          example: Linear transformations
        start_line:
          type:
            - integer
            - "null"
        end_line:
          type:
            - integer
            - "null"
        created_at:
          type: string
          format: date-time

    ListSubChaptersResponse:
      type: object
      required:
        - sub_chapters
      properties:
        sub_chapters:
          type: array
          items:
            $ref: "#/components/schemas/SubChapterSummary"

    SubChapterSummary:
      type: object
      required:
        - sub_chapter_id
        - document_id
        - chapter_id
        - sub_chapter_index
        - title
        - start_line
        - end_line
        - created_at
      properties:
        sub_chapter_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        sub_chapter_index:
          type:
            - integer
            - "null"
        title:
          type:
            - string
            - "null"
          example: Matrix representation
        start_line:
          type:
            - integer
            - "null"
        end_line:
          type:
            - integer
            - "null"
        created_at:
          type: string
          format: date-time

    TaskStatusResponse:
      type: object
      required:
        - task_id
        - document_id
        - status
        - error
        - updated_at
      properties:
        task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        document_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, successful, failed]
          description: Temporary Redis task status.
        error:
          type:
            - string
            - "null"
          description: Failure details when `status` is `failed`; otherwise `null`.
        updated_at:
          type: string
          format: date-time

    GameStartWebSocketMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.start
        data:
          type: object
          required: [sub_chapter_id]
          properties:
            sub_chapter_id:
              type: string
              format: uuid
              description: Indexed sub-chapter to generate a level for.

    GameFreePlayStartWebSocketMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.freeplay.start
        data:
          type: object
          required: [chapter_id]
          properties:
            chapter_id:
              type: string
              format: uuid
              description: Chapter whose sub-chapter quizzes should feed free play.

    GameLoadWebSocketMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.load
        data:
          type: object
          required: [level_id]
          properties:
            level_id:
              type: string
              format: uuid
              description: Completed level id returned by generation status.

    GameFreePlayLoadWebSocketMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.freeplay.load
        data:
          type: object
          required: [free_play_id]
          properties:
            free_play_id:
              type: string
              format: uuid
              description: Free play id returned by `freeplay.started`.

    GameSessionStartWebSocketMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.session.start
        data:
          type: object
          required: [level_id]
          properties:
            level_id:
              type: string
              format: uuid
              description: Completed level id to start an authoritative gameplay session for.

    GameFreePlaySessionStartWebSocketMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.freeplay.session.start
        data:
          type: object
          required: [free_play_id, chapter_id]
          properties:
            free_play_id:
              type: string
              format: uuid
              description: Free play id returned by `freeplay.started`.
            chapter_id:
              type: string
              format: uuid
              description: Chapter id used to start free play.

    GameSessionRunWebSocketMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: game.session.run

    GamePlaceTowerActionMessage:
      type: object
      description: Place a base bird tower on an empty grid tile. Hybrid birds must be created with `game.action.merge_tower` instead.
      required: [type, data]
      properties:
        type:
          type: string
          const: game.action.place_tower
        data:
          type: object
          required: [bird_type, x, y]
          properties:
            bird_type:
              type: string
              enum: [sparrow, woodpecker, eagle, peacock]
              description: Base bird type to place. Hybrid bird types are rejected for direct placement.
            x:
              type: integer
              description: Grid column.
            y:
              type: integer
              description: Grid row.

    GameMergeTowerActionMessage:
      type: object
      description: Merge an existing target tower with either another existing tower or a newly purchased base bird type. The hybrid appears at the target tower's position.
      required: [type, data]
      properties:
        type:
          type: string
          const: game.action.merge_tower
        data:
          type: object
          required: [target_bird_id]
          properties:
            source_bird_id:
              type: string
              description: Existing bird id to consume as one merge parent. Mutually exclusive with `source_bird_type`; consumes the resulting hybrid's upgrade essence cost.
            source_bird_type:
              type: string
              enum: [sparrow, woodpecker, eagle, peacock]
              description: Base bird type to buy and merge into the target tower. Mutually exclusive with `source_bird_id`; consumes this bird type's normal essence cost plus the resulting hybrid's upgrade essence cost.
            target_bird_id:
              type: string
              description: Existing bird id to consume as the target merge parent; the hybrid appears at this bird's position.
          description: |
            Exactly one of `source_bird_id` or `source_bird_type` is required.

            Supported unordered merge recipes:
            - `sparrow` + `eagle` -> `falcon`
            - `woodpecker` + `peacock` -> `kingfisher`
            - `peacock` + `eagle` -> `phoenix`
            - `kingfisher` + `eagle` -> `sun_god`

            Hybrid upgrade costs: `falcon`, `kingfisher`, and `phoenix` cost 50 essence; `sun_god` costs 200 essence.

    GameUseConsumableActionMessage:
      type: object
      description: |
        Resolve a consumable impact immediately. For Airstrike, the server
        validates availability and exactly three map targets, consumes one
        charge, and applies damage with no success-specific reply. The next
        `game.state` contains authoritative enemy health and inventory. Each
        target deals 80 damage in a two-tile radius; overlapping target areas
        apply their damage independently.
      required: [type, data]
      properties:
        type:
          type: string
          const: game.action.use_consumable
        data:
          type: object
          required: [item_type, targets]
          properties:
            item_type:
              type: string
              enum: [airstrike]
            targets:
              type: array
              minItems: 3
              maxItems: 3
              description: Three distinct in-map target positions.
              items:
                $ref: "#/components/schemas/GridPosition"

    GamePauseWebSocketMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: game.pause

    GameExitWebSocketMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: game.exit
        data:
          type: object
          properties:
            session_id:
              type: string
              format: uuid
              description: Optional session id to delete if the local loop has already stopped.

    GameQuizRequestMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: game.quiz.request

    GameQuizAnswerMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.quiz.answer
        data:
          type: object
          required: [quiz_id, selected_index]
          properties:
            quiz_id:
              type: string
              format: uuid
            selected_index:
              type: integer
              minimum: 0
              description: Zero-based option index chosen by the player.

    GameConsumableAcquireMessage:
      type: object
      description: Request a quiz that awards one consumable charge when answered correctly.
      required: [type, data]
      properties:
        type:
          type: string
          const: game.consumable.acquire
        data:
          type: object
          required: [item_type]
          properties:
            item_type:
              type: string
              enum: [airstrike]

    GameConsumableQuizAnswerMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.consumable.quiz.answer
        data:
          type: object
          required: [item_type, quiz_id, selected_index]
          properties:
            item_type:
              type: string
              enum: [airstrike]
            quiz_id:
              type: string
              format: uuid
            selected_index:
              type: integer
              minimum: 0
              description: Zero-based option index chosen by the player.

    LevelGenerationStartedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: level_generation.started
        data:
          $ref: "#/components/schemas/LevelGenerationStartResult"

    FreePlayStartedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: freeplay.started
        data:
          $ref: "#/components/schemas/FreePlayStartResult"

    GameInitialStateMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.initial_state
        data:
          $ref: "#/components/schemas/GameInitialState"

    GameSessionStartedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.session.started
        data:
