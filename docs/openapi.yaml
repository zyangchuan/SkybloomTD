          type: string
          const: game.consumable.resolved
        data:
          $ref: "#/components/schemas/ConsumableResolution"

    GameActionRejectedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.action.rejected
        data:
          type: object
          required: [action, error]
          properties:
            action:
              type: string
              enum: [place_tower, merge_tower, prepare_consumable, commit_consumable, validate_consumable_acquire]
