            removed_bird_ids:
              type: array
              description: Present for successful `merge_tower`; lists consumed existing bird ids. Existing-tower merges include source and target ids, while bought-source merges include only the target id.
              items:
                type: string

    GameConsumablePreparedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.consumable.prepared
        data:
          type: object
          required: [deployment, consumables]
          properties:
            deployment:
              $ref: "#/components/schemas/ConsumableDeployment"
