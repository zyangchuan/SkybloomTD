openapi: 3.1.0
info:
  title: SkyBloomTD Edge API
  version: 0.1.0
  description: |
    Public API exposed through the Nginx reverse proxy.

    Only the reverse proxy publishes a host port. Backend services are private
    Docker-network services and should be accessed through these paths.

    Protected backend routes require a Supabase JWT stored in the
    `skybloom_access_token` cookie. Nginx verifies the cookie through
    `user-service /auth/verify` and forwards trusted identity headers to
    private services.
servers:
  - url: http://localhost
    description: Local Docker Compose reverse proxy
tags:
  - name: System
    description: Public health and documentation endpoints.
  - name: Auth
    description: Authentication verification endpoints.
  - name: Users
    description: User profile persistence backed by `private.users`.
  - name: Document Content
    description: PDF/document upload and OCR workflow entrypoints.
  - name: Game Service
    description: Authoritative game websocket and level generation workflow.

paths:
  /nginx-health:
    get:
      tags: [System]
      summary: Check reverse proxy health
      operationId: getNginxHealth
      security: []
      responses:
        "200":
          description: Reverse proxy is healthy.
          content:
            text/plain:
              schema:
                type: string
              example: ok

  /openapi.yaml:
    get:
      tags: [System]
      summary: Download this OpenAPI document
      operationId: getOpenApiDocument
      security: []
      responses:
        "200":
          description: OpenAPI YAML document.
          content:
            application/yaml:
              schema:
                type: string

  /api/user-service/health:
    get:
      tags: [System]
      summary: Check user-service process health
      operationId: getUserServiceHealth
      security: []
      responses:
        "200":
          description: Service process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/user-service/ready:
    get:
      tags: [System]
      summary: Check user-service database readiness
      operationId: getUserServiceReadiness
      security: []
      responses:
        "200":
          description: Service can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/user-service/auth/verify:
    get:
      tags: [Auth]
      summary: Verify the authentication cookie
      description: |
        Stateless Supabase token verification endpoint used by Nginx
        `auth_request`. Clients generally do not need to call this directly.
      operationId: verifySupabaseJwt
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Authentication cookie is valid.
          headers:
            X-User-Id:
              description: Authenticated Supabase user id from the JWT `sub` claim.
              schema:
                type: string
                format: uuid
            X-User-Email:
              description: User email from the JWT, when present.
              schema:
                type: string
                format: email
        "401":
          description: Authentication cookie is missing, invalid, expired, or misconfigured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users:
    post:
      tags: [Users]
      summary: Create or update the authenticated user profile
      description: |
        Stores the authenticated Supabase user in `private.users`. The database
        user id is always taken from the JWT `sub` claim in the authentication
        cookie. If `id` is included in the body, it must match the JWT subject.
      operationId: upsertUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserRequest"
            example:
              user_name: Ada
              email: ada@example.com
              metadata:
                avatar_url: https://example.com/avatar.png
      responses:
        "200":
          description: User profile was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request body id does not match authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/me:
    post:
      tags: [Users]
      summary: Create or update the authenticated user profile
      description: Alias of `POST /api/users`.
      operationId: upsertCurrentUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserRequest"
      responses:
        "200":
          description: User profile was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request body id does not match authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/upload-file:
    post:
      tags: [Document Content]
      summary: Upload a document for OCR and indexing
      description: |
        Shortcut route for `POST /api/document-content/upload-file`.

        The authenticated user id is taken from the Supabase JWT stored in the
        authentication cookie. Do not send a `user_id` field; client-supplied
        user ids are ignored by the backend.
      operationId: uploadDocumentShortcut
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadDocumentRequest"
      responses:
        "200":
          description: OCR/indexing workflow was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDocumentResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid multipart upload or missing `file`/`game_name` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Uploaded file exceeds proxy size limit.
        "500":
          description: Source storage or document row creation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Task status recording or RabbitMQ enqueue failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/upload-file:
    post:
      tags: [Document Content]
      summary: Upload a document for OCR and indexing
      description: |
        Queues the OCR/indexing workflow. The API creates a durable document
        row immediately with `is_ready = false`, stores the main task status in
        Redis as `queued`, and publishes the worker job to RabbitMQ.
      operationId: uploadDocument
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadDocumentRequest"
      responses:
        "200":
          description: OCR/indexing workflow was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDocumentResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid multipart upload or missing `file`/`game_name` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Uploaded file exceeds proxy size limit.
        "500":
          description: Source storage or document row creation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Task status recording or RabbitMQ enqueue failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/documents:
    get:
      tags: [Document Content]
      summary: List current user's documents
      description: |
        Returns durable document rows for the authenticated user. Each item
        includes `is_ready` for durable usability and `task_id` for polling
        temporary Redis task status while processing is still in progress.
      operationId: listCurrentUserDocuments
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user's documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDocumentsResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/documents/{document_id}:
    delete:
      tags: [Document Content]
      summary: Delete a document and generated content
      description: |
        Deletes a document owned by the authenticated user. The service removes
        S3/local document assets, generated quizzes/levels for the document,
        document chunks/sections, and the document row.
      operationId: deleteDocument
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Document and generated content were deleted.
        "400":
          description: Invalid document id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Asset deletion or database deletion failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/documents/{document_id}/chapters:
    get:
      tags: [Document Content]
      summary: List chapters for a document
      description: |
        Returns indexed chapters for a document owned by the authenticated user.
        A document that is not ready yet may return an empty chapter list.
      operationId: listDocumentChapters
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document chapters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChaptersResponse"
        "400":
          description: Invalid document id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/chapters/{chapter_id}/sub-chapters:
    get:
      tags: [Document Content]
      summary: List sub-chapters for a chapter
      description: Returns indexed sub-chapters for a chapter owned by the authenticated user.
      operationId: listChapterSubChapters
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: Chapter sub-chapters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSubChaptersResponse"
        "400":
          description: Invalid chapter id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Chapter was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/tasks/{task_id}/status:
    get:
      tags: [Document Content]
      summary: Get document processing task status
      description: |
        Reads the temporary Redis task status for a document processing job.
        Status records expire after the configured task-status TTL, which is
        seven days by default. If the Redis key has expired, use the document
        `is_ready` flag as the durable readiness signal.
      operationId: getDocumentTaskStatus
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task status was found in Redis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task status was not found or has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Redis status lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/game-service/health:
    get:
      tags: [Game Service]
      summary: Check game-service process health through the protected proxy route
      operationId: getGameServiceHealth
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Game-service process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/game-service/ready:
    get:
      tags: [Game Service]
      summary: Check game-service database readiness through the protected proxy route
      operationId: getGameServiceReadiness
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Game-service can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/game-service/ws:
    get:
      tags: [Game Service]
      summary: Open the authoritative game websocket
      description: |
        WebSocket endpoint for the game client. Browser clients should connect
        to `ws://localhost/api/game-service/ws` locally, or `wss://...` in
        production. Authentication is supplied by the `skybloom_access_token`
        cookie.

        After the connection opens, send `game.start` with a `sub_chapter_id`.
        The server responds with `level_generation.started`, including a
        `generation_id` and `status_url`. Poll the status URL until generation
        is complete, then send `game.load` with the returned `level_id` to
        receive `game.initial_state`. The initial state exposes only map data;
        quiz answer data stays server-side in the dedicated game Redis cache.
        To begin authoritative gameplay, send `game.session.start` with the
        completed `level_id`. The server initializes a Redis-backed session
        with `health=100`, `essence=1000`, and `wave=0`, returns
        `game.session.started` with the available bird type stats, then streams
        `game.state` snapshots at 20 Hz. During the session, clients can send
        `game.action.place_tower` with a `bird_type` and grid `x`/`y`.
        Reconnecting with the same `level_id` reuses the existing Redis session
        for that user and level, including placed birds and current essence,
        until the session expires.

        If the database already has quizzes for the authenticated user's
        sub-chapter, the service reuses the saved level instead of generating
        a new quiz set. Quiz answer data is copied into the dedicated game
        Redis cache for authoritative validation during play.
      operationId: openGameWebSocket
      security:
        - cookieAuth: []
      x-websocket-client-messages:
        - $ref: "#/components/schemas/GameStartWebSocketMessage"
        - $ref: "#/components/schemas/GameLoadWebSocketMessage"
        - $ref: "#/components/schemas/GameSessionStartWebSocketMessage"
        - $ref: "#/components/schemas/GamePlaceTowerActionMessage"
      x-websocket-server-messages:
        - $ref: "#/components/schemas/LevelGenerationStartedMessage"
        - $ref: "#/components/schemas/GameInitialStateMessage"
        - $ref: "#/components/schemas/GameSessionStartedMessage"
        - $ref: "#/components/schemas/GameStateMessage"
        - $ref: "#/components/schemas/GameActionAcceptedMessage"
        - $ref: "#/components/schemas/GameActionRejectedMessage"
        - $ref: "#/components/schemas/GameErrorMessage"
      responses:
        "101":
          description: WebSocket upgrade accepted.
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/game-service/level-generation/{generation_id}/status:
    get:
      tags: [Game Service]
      summary: Get level generation status
      description: |
        Poll this short-lived Redis-backed status after the websocket
        `game.start` response. If Redis status has expired but the level was
        completed, the server reconstructs a complete status from the durable
        generation row.
      operationId: getGameLevelGenerationStatus
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/GenerationId"
      responses:
        "200":
          description: Current generation status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LevelGenerationStatus"
        "401":
          description: Missing or invalid authentication cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Generation was not found, belongs to another user, or status has expired before completion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Generation status dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: skybloom_access_token

  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      description: Main document processing task id returned by upload.
      schema:
        type: string
        pattern: "^[a-f0-9]{32}$"
    DocumentId:
      name: document_id
      in: path
      required: true
      description: Document id returned by upload or document listing.
      schema:
        type: string
        format: uuid
    ChapterId:
      name: chapter_id
      in: path
      required: true
      description: Chapter id returned by the document chapters endpoint.
      schema:
        type: string
        format: uuid
    GenerationId:
      name: generation_id
      in: path
      required: true
      description: Level generation id returned by the `level_generation.started` websocket message.
      schema:
        type: string
        pattern: "^[a-f0-9]{32}$"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ready

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: authentication required

    FastApiValidationError:
      type: object
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true

    UpsertUserRequest:
      type: object
      required: [user_name]
      properties:
        id:
          type: string
          format: uuid
          description: Optional. If provided, must match the authenticated JWT `sub` claim.
        email:
          type: string
          format: email
        user_name:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties: true

    User:
      type: object
      required: [id, user_name, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        user_name:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UploadDocumentRequest:
      type: object
      required: [file, game_name]
      properties:
        file:
          type: string
          format: binary
          description: Document file to OCR. PDFs are expected by the current worker flow.
        game_name:
          type: string
          maxLength: 120
          description: User-facing game name generated from this document.
          example: Linear Algebra TD

    UploadDocumentResponse:
      type: object
      required:
        - message
        - task_id
        - ocr_task_id
        - upload_task_id
        - index_task_id
        - user_id
        - document_id
        - game_name
        - is_ready
      properties:
        message:
          type: string
          example: Upload file success
        task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
          description: Main document processing task id. Poll this id through the task status endpoint.
        ocr_task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        upload_task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        index_task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        user_id:
          type: string
          format: uuid
          description: Authenticated Supabase user id from the authenticated JWT.
        document_id:
          type: string
          format: uuid
          description: Generated document id. The document row exists immediately with `is_ready = false`.
        game_name:
          type: string
          description: User-facing game name stored on the document row.
          example: Linear Algebra TD
        is_ready:
          type: boolean
          description: Durable document readiness flag. It is `false` until indexing succeeds.
          example: false

    ListDocumentsResponse:
      type: object
      required:
        - documents
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSummary"

    DocumentSummary:
      type: object
      required:
        - document_id
        - filename
        - game_name
        - is_ready
        - task_id
        - created_at
        - updated_at
      properties:
        document_id:
          type: string
          format: uuid
        filename:
          type: string
          example: lesson.pdf
        game_name:
          type: string
          example: Linear Algebra TD
        is_ready:
          type: boolean
          description: Durable document readiness flag. `true` only after indexing succeeds.
        task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
          description: Main document processing task id.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListChaptersResponse:
      type: object
      required:
        - chapters
      properties:
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/ChapterSummary"

    ChapterSummary:
      type: object
      required:
        - chapter_id
        - document_id
        - chapter_index
        - title
        - start_line
        - end_line
        - created_at
      properties:
        chapter_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        chapter_index:
          type:
            - integer
            - "null"
        title:
          type:
            - string
            - "null"
          example: Linear transformations
        start_line:
          type:
            - integer
            - "null"
        end_line:
          type:
            - integer
            - "null"
        created_at:
          type: string
          format: date-time

    ListSubChaptersResponse:
      type: object
      required:
        - sub_chapters
      properties:
        sub_chapters:
          type: array
          items:
            $ref: "#/components/schemas/SubChapterSummary"

    SubChapterSummary:
      type: object
      required:
        - sub_chapter_id
        - document_id
        - chapter_id
        - sub_chapter_index
        - title
        - start_line
        - end_line
        - created_at
      properties:
        sub_chapter_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        sub_chapter_index:
          type:
            - integer
            - "null"
        title:
          type:
            - string
            - "null"
          example: Matrix representation
        start_line:
          type:
            - integer
            - "null"
        end_line:
          type:
            - integer
            - "null"
        created_at:
          type: string
          format: date-time

    TaskStatusResponse:
      type: object
      required:
        - task_id
        - document_id
        - status
        - error
        - updated_at
      properties:
        task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        document_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, successful, failed]
          description: Temporary Redis task status.
        error:
          type:
            - string
            - "null"
          description: Failure details when `status` is `failed`; otherwise `null`.
        updated_at:
          type: string
          format: date-time

    GameStartWebSocketMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.start
        data:
          type: object
          required: [sub_chapter_id]
          properties:
            sub_chapter_id:
              type: string
              format: uuid
              description: Indexed sub-chapter to generate a level for.

    GameLoadWebSocketMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.load
        data:
          type: object
          required: [level_id]
          properties:
            level_id:
              type: string
              format: uuid
              description: Completed level id returned by generation status.

    GameSessionStartWebSocketMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.session.start
        data:
          type: object
          required: [level_id]
          properties:
            level_id:
              type: string
              format: uuid
              description: Completed level id to start an authoritative gameplay session for.

    GamePlaceTowerActionMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.action.place_tower
        data:
          type: object
          required: [bird_type, x, y]
          properties:
            bird_type:
              type: string
              enum: [sparrow, woodpecker, eagle, peacock]
            x:
              type: integer
              description: Grid column.
            y:
              type: integer
              description: Grid row.

    LevelGenerationStartedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: level_generation.started
        data:
          $ref: "#/components/schemas/LevelGenerationStartResult"

    GameInitialStateMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.initial_state
        data:
          $ref: "#/components/schemas/GameInitialState"

    GameSessionStartedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.session.started
        data:
          $ref: "#/components/schemas/GameState"

    GameStateMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.state
        data:
          $ref: "#/components/schemas/GameState"

    GameActionAcceptedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.action.accepted
        data:
          type: object
          required: [action, bird_id, bird]
          properties:
            action:
              type: string
              example: place_tower
            bird_id:
              type: string
              format: uuid
            bird:
              $ref: "#/components/schemas/PlacedBird"

    GameActionRejectedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.action.rejected
        data:
          type: object
          required: [action, error]
          properties:
            action:
              type: string
              example: place_tower
            error:
              type: string
              example: insufficient essence

    GameErrorMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: error
        data:
          type: object
          required: [error]
          properties:
            error:
              type: string
              example: unsupported message type

    LevelGenerationStartResult:
      type: object
      required:
        - generation_id
        - user_id
        - sub_chapter_id
        - status
        - map_status
        - quiz_status
        - map_seed
        - map_algorithm_version
        - reused
        - status_url
      properties:
        generation_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        user_id:
          type: string
          format: uuid
          description: Authenticated Supabase user id from the JWT.
        sub_chapter_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LevelGenerationOverallStatus"
        map_status:
          $ref: "#/components/schemas/LevelGenerationStepStatus"
        quiz_status:
          $ref: "#/components/schemas/LevelGenerationStepStatus"
        map_seed:
          type: integer
          format: int64
        map_algorithm_version:
          type: integer
          example: 1
        level_id:
          type: string
          format: uuid
          description: Present when an idempotent request reuses an already completed level.
        reused:
          type: boolean
          description: True when the request reused an existing generation or a saved level that already has quizzes for this user and sub-chapter.
        status_url:
          type: string
          example: /api/game-service/level-generation/0d2a8c64c36f4a7d88442a7517c9f014/status

    LevelGenerationStatus:
      type: object
      required:
        - generation_id
        - user_id
        - sub_chapter_id
        - status
        - map_status
        - quiz_status
        - map_seed
        - map_algorithm_version
        - updated_at
      properties:
        generation_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        user_id:
          type: string
          format: uuid
        sub_chapter_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LevelGenerationOverallStatus"
        map_status:
          $ref: "#/components/schemas/LevelGenerationStepStatus"
        quiz_status:
          $ref: "#/components/schemas/LevelGenerationStepStatus"
        map_seed:
          type: integer
          format: int64
        map_algorithm_version:
          type: integer
          example: 1
        level_id:
          type: string
          format: uuid
          description: Present when `status` is `complete`.
        error:
          type: string
          description: Present when generation fails.
        updated_at:
          type: string
          format: date-time

    LevelGenerationOverallStatus:
      type: string
      enum: [pending, complete, failed]

    LevelGenerationStepStatus:
      type: string
      enum: [pending, running, complete, failed]

    GameInitialState:
      type: object
      required: [map]
      properties:
        map:
          $ref: "#/components/schemas/GeneratedMap"

    GameState:
      type: object
      description: Authoritative gameplay snapshot. After `game.session.started`, `game.state` messages are sent 20 times per second.
      required: [session_id, level_id, health, essence, wave, tick, server_time, birds]
      properties:
        session_id:
          type: string
          format: uuid
        level_id:
          type: string
          format: uuid
        health:
          type: integer
          example: 100
        essence:
          type: integer
          example: 1000
        wave:
          type: integer
          example: 0
        tick:
          type: integer
          format: int64
          example: 0
        server_time:
          type: string
          format: date-time
        bird_types:
          type: array
          description: Present on `game.session.started`; lists available tower/bird types.
          items:
            $ref: "#/components/schemas/BirdTypeInfo"
        birds:
          type: array
          description: Placed birds in the current session.
          items:
            $ref: "#/components/schemas/PlacedBird"

    BirdTypeInfo:
      type: object
      required: [type, stats, attack]
      properties:
        type:
          type: string
          enum: [sparrow, woodpecker, eagle, peacock]
        stats:
          $ref: "#/components/schemas/BirdStats"
        attack:
          type: string
          enum: [single, splash]

    PlacedBird:
      type: object
      required: [id, type, position, stats, last_fired_at_tick]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [sparrow, woodpecker, eagle, peacock]
        position:
          $ref: "#/components/schemas/GridPosition"
        stats:
          $ref: "#/components/schemas/BirdStats"
        last_fired_at_tick:
          type: integer
          format: int64

    BirdStats:
      type: object
      required: [damage, projectile_speed, fire_rate, range, cost]
      properties:
        damage:
          type: integer
        projectile_speed:
          type: number
          format: double
        fire_rate:
          type: number
          format: double
        range:
          type: number
          format: double
        cost:
          type: integer

    GridPosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    GeneratedMap:
      type: object
      required: [version, seed, width, height, enemy_path, objects]
      properties:
        version:
          type: integer
          example: 1
        seed:
          type: integer
          format: int64
        width:
          type: integer
          example: 18
        height:
          type: integer
          example: 12
        enemy_path:
          type: array
          description: Ordered path tiles from the enemy spawn edge to the exit edge.
          items:
            $ref: "#/components/schemas/PathTile"
        objects:
          type: array
          description: Decorative or blocking map objects generated outside the enemy path and its one-tile placement buffer.
          items:
            $ref: "#/components/schemas/MapObject"

    PathTile:
      type: object
      required: [x, y, kind]
      properties:
        x:
          type: integer
          minimum: 0
          maximum: 17
        y:
          type: integer
          minimum: 0
          maximum: 11
        kind:
          type: string
          enum: [start, end, straight, turn]
        from:
          $ref: "#/components/schemas/GridDirection"
        to:
          $ref: "#/components/schemas/GridDirection"
        axis:
          type: string
          enum: [horizontal, vertical]
          description: Present on straight path tiles.
        turn:
          type: string
          enum: [left, right]
          description: Present on turn path tiles.

    GridDirection:
      type: string
      enum: [north, east, south, west]

    MapObject:
      type: object
      required: [type, x, y]
      properties:
        type:
          type: string
          enum: [tree, tree_stump, bush, rock]
        x:
          type: integer
          minimum: 0
          maximum: 17
        y:
          type: integer
          minimum: 0
          maximum: 11
