        is_ready:
          type: boolean
          description: Durable document readiness flag. `true` only after indexing succeeds.
        task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
          description: Main document processing task id.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListChaptersResponse:
      type: object
      required:
