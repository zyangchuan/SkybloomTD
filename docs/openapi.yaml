        chapters:
          type: array
          items:
            $ref: "#/components/schemas/ChapterSummary"

    ChapterSummary:
      type: object
      required:
        - chapter_id
        - document_id
        - chapter_index
        - title
        - start_line
        - end_line
        - created_at
      properties:
        chapter_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        chapter_index:
          type:
            - integer
            - "null"
        title:
          type:
            - string
            - "null"
          example: Linear transformations
        start_line:
          type:
            - integer
            - "null"
        end_line:
          type:
            - integer
            - "null"
        created_at:
          type: string
          format: date-time

    ListSubChaptersResponse:
      type: object
      required:
        - sub_chapters
      properties:
        sub_chapters:
          type: array
          items:
            $ref: "#/components/schemas/SubChapterSummary"

    SubChapterSummary:
      type: object
      required:
        - sub_chapter_id
        - document_id
        - chapter_id
        - sub_chapter_index
        - title
        - start_line
        - end_line
        - created_at
      properties:
        sub_chapter_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        sub_chapter_index:
          type:
            - integer
            - "null"
        title:
          type:
            - string
            - "null"
          example: Matrix representation
        start_line:
          type:
            - integer
            - "null"
        end_line:
          type:
            - integer
            - "null"
        created_at:
          type: string
          format: date-time

    TaskStatusResponse:
      type: object
      required:
        - task_id
        - document_id
        - status
        - error
        - updated_at
      properties:
        task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        document_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, successful, failed]
          description: Temporary Redis task status.
        error:
          type:
            - string
            - "null"
          description: Failure details when `status` is `failed`; otherwise `null`.
        updated_at:
          type: string
          format: date-time

    GameStartWebSocketMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.start
        data:
          type: object
          required: [sub_chapter_id]
          properties:
            sub_chapter_id:
              type: string
              format: uuid
              description: Indexed sub-chapter to generate a level for.

    GameLoadWebSocketMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.load
        data:
          type: object
          required: [level_id]
          properties:
            level_id:
              type: string
              format: uuid
              description: Completed level id returned by generation status.

    GameSessionStartWebSocketMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.session.start
        data:
          type: object
          required: [level_id]
          properties:
            level_id:
              type: string
              format: uuid
              description: Completed level id to start an authoritative gameplay session for.

    GamePlaceTowerActionMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.action.place_tower
        data:
          type: object
          required: [bird_type, x, y]
          properties:
            bird_type:
              type: string
              enum: [sparrow, woodpecker, eagle, peacock]
            x:
              type: integer
              description: Grid column.
            y:
              type: integer
              description: Grid row.

    GamePauseWebSocketMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: game.pause

    GameExitWebSocketMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: game.exit
        data:
          type: object
          properties:
            session_id:
              type: string
              format: uuid
              description: Optional session id to delete if the local loop has already stopped.

    GameQuizRequestMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: game.quiz.request

    GameQuizAnswerMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.quiz.answer
        data:
          type: object
          required: [quiz_id, selected_index]
          properties:
            quiz_id:
              type: string
              format: uuid
            selected_index:
              type: integer
              minimum: 0
              description: Zero-based option index chosen by the player.

    LevelGenerationStartedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: level_generation.started
        data:
          $ref: "#/components/schemas/LevelGenerationStartResult"

    GameInitialStateMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.initial_state
        data:
          $ref: "#/components/schemas/GameInitialState"

    GameSessionStartedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.session.started
        data:
          $ref: "#/components/schemas/GameState"

    GameStateMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.state
        data:
          $ref: "#/components/schemas/GameState"

    GameOverMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.over
        data:
          $ref: "#/components/schemas/GameOverState"

    GameVictoryMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.victory
        data:
          $ref: "#/components/schemas/GameVictoryState"

    GamePausedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.paused
        data:
          $ref: "#/components/schemas/GamePausedState"

    GameExitedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.exited
        data:
          $ref: "#/components/schemas/GameExitedState"

    GameQuizPresentedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.quiz.presented
        data:
          $ref: "#/components/schemas/QuizPrompt"

    GameQuizResultMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.quiz.result
        data:
          $ref: "#/components/schemas/QuizResult"

    GameQuizUnavailableMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.quiz.unavailable
        data:
          $ref: "#/components/schemas/QuizUnavailable"

    GameActionAcceptedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.action.accepted
        data:
          type: object
          required: [action, bird_id, bird]
          properties:
            action:
              type: string
              example: place_tower
            bird_id:
              type: string
              format: uuid
            bird:
              $ref: "#/components/schemas/PlacedBird"

    GameActionRejectedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.action.rejected
        data:
          type: object
          required: [action, error]
          properties:
            action:
              type: string
              example: place_tower
            error:
              type: string
              example: insufficient essence

    GameErrorMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: error
        data:
          type: object
          required: [error]
          properties:
            error:
              type: string
              example: unsupported message type

    LevelGenerationStartResult:
      type: object
      required:
        - generation_id
        - user_id
        - sub_chapter_id
        - status
        - map_status
        - quiz_status
        - map_seed
        - map_algorithm_version
        - reused
        - status_url
      properties:
        generation_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        user_id:
          type: string
          format: uuid
          description: Authenticated Supabase user id from the JWT.
        sub_chapter_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LevelGenerationOverallStatus"
        map_status:
          $ref: "#/components/schemas/LevelGenerationStepStatus"
        quiz_status:
          $ref: "#/components/schemas/LevelGenerationStepStatus"
        map_seed:
          type: integer
          format: int64
        map_algorithm_version:
          type: integer
          example: 1
        level_id:
          type: string
          format: uuid
          description: Present when an idempotent request reuses an already completed level.
        reused:
          type: boolean
          description: True when the request reused an existing generation or a saved level that already has quizzes for this user and sub-chapter.
        status_url:
          type: string
          example: /api/game-service/level-generation/0d2a8c64c36f4a7d88442a7517c9f014/status

    LevelGenerationStatus:
      type: object
      required:
        - generation_id
        - user_id
        - sub_chapter_id
        - status
        - map_status
        - quiz_status
        - map_seed
        - map_algorithm_version
        - updated_at
      properties:
        generation_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        user_id:
          type: string
          format: uuid
        sub_chapter_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LevelGenerationOverallStatus"
        map_status:
          $ref: "#/components/schemas/LevelGenerationStepStatus"
        quiz_status:
          $ref: "#/components/schemas/LevelGenerationStepStatus"
        map_seed:
          type: integer
          format: int64
        map_algorithm_version:
          type: integer
          example: 1
        level_id:
          type: string
          format: uuid
          description: Present when `status` is `complete`.
        error:
          type: string
          description: Present when generation fails.
        updated_at:
          type: string
          format: date-time

    LevelGenerationOverallStatus:
      type: string
      enum: [pending, complete, failed]

    LevelGenerationStepStatus:
      type: string
      enum: [pending, running, complete, failed]

    GameInitialState:
      type: object
      required: [map]
      properties:
        map:
          $ref: "#/components/schemas/GeneratedMap"

    GameState:
      type: object
      description: Authoritative gameplay snapshot. After the first correct quiz answer starts the loop, `game.state` messages are sent 20 times per second.
      required: [session_id, level_id, health, essence, wave, tick, loop_started, loop_paused, server_time, birds, smogs, projectiles]
      properties:
        session_id:
          type: string
          format: uuid
        level_id:
          type: string
          format: uuid
        health:
          type: integer
          example: 100
        essence:
          type: integer
          example: 1000
        wave:
          type: integer
          example: 0
        tick:
          type: integer
          format: int64
          example: 0
        loop_started:
          type: boolean
          description: False until the player answers a quiz correctly and unlocks the gameplay ticker.
        loop_paused:
          type: boolean
          description: True when the server has paused the gameplay ticker and is no longer advancing ticks, enemies, combat, or wave spawning.
        server_time:
          type: string
          format: date-time
        bird_types:
          type: array
          description: Present on `game.session.started`; lists available tower/bird types.
          items:
            $ref: "#/components/schemas/BirdTypeInfo"
        birds:
          type: array
          description: Placed birds in the current session.
          items:
            $ref: "#/components/schemas/PlacedBird"
        smogs:
          type: array
          description: Active enemies with authoritative positions and health.
          items:
            $ref: "#/components/schemas/Smog"
        projectiles:
          type: array
          description: Active projectiles in flight.
          items:
            $ref: "#/components/schemas/Projectile"
        events:
          type: array
          description: Transient events emitted for this tick, such as attacks, damage, spawns, escapes, and wave starts.
          items:
            $ref: "#/components/schemas/GameEvent"

    GameOverState:
      type: object
      required: [session_id, level_id, health, wave, tick, reason]
      properties:
        session_id:
          type: string
          format: uuid
        level_id:
          type: string
          format: uuid
        health:
          type: integer
          example: 0
        wave:
          type: integer
          example: 3
        tick:
          type: integer
          format: int64
        reason:
          type: string
          example: health_depleted

    GameVictoryState:
      type: object
      required: [session_id, level_id, health, wave, tick, reason]
      properties:
        session_id:
          type: string
          format: uuid
        level_id:
          type: string
          format: uuid
        health:
          type: integer
          example: 40
        wave:
          type: integer
          example: 3
        tick:
          type: integer
          format: int64
        reason:
          type: string
          example: all_waves_cleared

    GamePausedState:
      type: object
      required: [session_id, level_id, tick, loop_started, loop_paused]
      properties:
        session_id:
          type: string
          format: uuid
        level_id:
          type: string
          format: uuid
        tick:
          type: integer
          format: int64
        loop_started:
          type: boolean
        loop_paused:
          type: boolean
          example: true

    GameExitedState:
      type: object
      required: [deleted, reason]
      properties:
        session_id:
          type: string
          format: uuid
        deleted:
          type: boolean
          description: Whether a Redis gameplay session was deleted.
        reason:
          type: string
          example: client_exit

    QuizPrompt:
      type: object
      description: Quiz prompt sent to the client without answer data.
      required: [quiz_id, quiz_type, question_markdown, options_markdown, remaining]
      properties:
        quiz_id:
          type: string
          format: uuid
        quiz_type:
          type: string
          enum: [mcq, true_false]
        question_markdown:
          type: string
        options_markdown:
          type: array
          items:
            type: string
        remaining:
          type: integer
          description: Number of quizzes remaining before answering this prompt.

    QuizResult:
      type: object
      required: [quiz_id, correct, selected_index, essence_awarded, remaining, loop_started]
      properties:
        quiz_id:
          type: string
          format: uuid
        correct:
          type: boolean
        selected_index:
          type: integer
        essence_awarded:
          type: integer
          example: 30
        essence:
          type: integer
          description: Present when essence was awarded.
          example: 1030
        remaining:
          type: integer
          description: Number of quizzes left after deleting the answered quiz.
        loop_started:
          type: boolean
          description: True after a correct answer unlocks or confirms the gameplay loop.

    QuizUnavailable:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          example: no_quizzes_remaining

    QuizMistakeSummary:
      type: object
      required: [level_id, count, mistakes]
      properties:
        level_id:
          type: string
          format: uuid
        count:
          type: integer
          description: Number of saved mistakes returned.
        mistakes:
          type: array
          items:
            $ref: "#/components/schemas/QuizMistake"

    QuizMistake:
      type: object
      required:
        - id
        - level_id
        - generation_id
        - quiz_id
        - quiz_index
        - quiz_type
        - question_markdown
        - options_markdown
        - answer_index
        - selected_index
        - correct_option_markdown
        - selected_option_markdown
      properties:
        id:
          type: string
          format: uuid
        level_id:
          type: string
          format: uuid
        generation_id:
          type: string
          description: Level generation id that produced the quiz.
        quiz_id:
          type: string
          format: uuid
        quiz_index:
          type: integer
        quiz_type:
          type: string
          enum: [mcq, true_false]
        question_markdown:
          type: string
        options_markdown:
          type: array
          items:
            type: string
        answer_index:
          type: integer
          description: Zero-based correct option index.
        selected_index:
          type: integer
          description: Zero-based option index chosen by the player.
        correct_option_markdown:
          type: string
        selected_option_markdown:
          type: string
        created_at:
          type: string
          format: date-time

    BirdTypeInfo:
      type: object
      required: [type, stats, attack]
      properties:
        type:
          type: string
          enum: [sparrow, woodpecker, eagle, peacock]
        stats:
          $ref: "#/components/schemas/BirdStats"
        attack:
          type: string
          enum: [single, splash]

    PlacedBird:
      type: object
      required: [id, type, position, stats, last_fired_at_tick]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [sparrow, woodpecker, eagle, peacock]
        position:
          $ref: "#/components/schemas/GridPosition"
        stats:
          $ref: "#/components/schemas/BirdStats"
        last_fired_at_tick:
          type: integer
          format: int64

    Smog:
      type: object
      required: [id, health, position, speed, path_index]
      properties:
        id:
          type: string
          format: uuid
        health:
          type: integer
        position:
          $ref: "#/components/schemas/GridPosition"
        speed:
          type: number
          format: double
        path_index:
          type: integer

    Projectile:
      type: object
      required: [id, type, damage, projectile_speed, position, direction, remaining_range, hit_radius]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [locked, directional]
        damage:
          type: number
          format: double
        projectile_speed:
          type: number
          format: double
        position:
          $ref: "#/components/schemas/GridPosition"
        direction:
          $ref: "#/components/schemas/Vector"
        target_id:
          type: string
          format: uuid
          description: Present for locked projectiles.
        remaining_range:
          type: number
          format: double
        hit_radius:
          type: number
          format: double

    GameEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [wave.started, wave.cleared, smog.spawned, smog.escaped, bird.attack, smog.damage]
        bird_id:
          type: string
          format: uuid
        smog_id:
          type: string
          format: uuid
        projectile_id:
          type: string
          format: uuid
        projectile_ids:
          type: array
          items:
            type: string
            format: uuid
        damage:
          type: number
          format: double
        health:
          type: integer
          description: Remaining smog health for damage events, or remaining base health for escape events.
        wave:
          type: integer

    BirdStats:
      type: object
      required: [damage, projectile_speed, fire_rate, range, cost]
      properties:
        damage:
          type: integer
        projectile_speed:
          type: number
          format: double
        fire_rate:
          type: number
          format: double
        range:
          type: number
          format: double
        cost:
          type: integer

    GridPosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    Vector:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    GeneratedMap:
      type: object
      required: [version, seed, width, height, enemy_path, objects]
      properties:
        version:
          type: integer
          example: 1
        seed:
          type: integer
          format: int64
        width:
          type: integer
          example: 18
        height:
          type: integer
          example: 12
        enemy_path:
          type: array
          description: Ordered path tiles from the enemy spawn edge to the exit edge.
          items:
            $ref: "#/components/schemas/PathTile"
        objects:
          type: array
          description: Decorative or blocking map objects generated outside the enemy path and its one-tile placement buffer.
          items:
            $ref: "#/components/schemas/MapObject"

    PathTile:
      type: object
      required: [x, y, kind]
      properties:
        x:
          type: integer
          minimum: 0
          maximum: 17
        y:
          type: integer
          minimum: 0
          maximum: 11
        kind:
          type: string
          enum: [start, end, straight, turn]
        from:
          $ref: "#/components/schemas/GridDirection"
        to:
          $ref: "#/components/schemas/GridDirection"
        axis:
          type: string
          enum: [horizontal, vertical]
          description: Present on straight path tiles.
        turn:
          type: string
          enum: [left, right]
          description: Present on turn path tiles.

    GridDirection:
      type: string
      enum: [north, east, south, west]

    MapObject:
      type: object
      required: [type, x, y]
      properties:
        type:
          type: string
          enum: [tree, tree_stump, bush, rock]
        x:
          type: integer
          minimum: 0
          maximum: 17
        y:
          type: integer
          minimum: 0
          maximum: 11
