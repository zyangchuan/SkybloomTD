    GameStateMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.state
        data:
          $ref: "#/components/schemas/GameState"

    GameOverMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.over
        data:
          $ref: "#/components/schemas/GameOverState"

    GameVictoryMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.victory
        data:
          $ref: "#/components/schemas/GameVictoryState"

    GamePausedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.paused
        data:
          $ref: "#/components/schemas/GamePausedState"

    GameExitedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.exited
        data:
          $ref: "#/components/schemas/GameExitedState"

    GameQuizPresentedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.quiz.presented
        data:
          $ref: "#/components/schemas/QuizPrompt"

    GameQuizResultMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.quiz.result
        data:
          $ref: "#/components/schemas/QuizResult"

    GameQuizUnavailableMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.quiz.unavailable
        data:
          $ref: "#/components/schemas/QuizUnavailable"

    GameConsumableQuizPresentedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.consumable.quiz.presented
        data:
          $ref: "#/components/schemas/ConsumableQuizPrompt"

    GameConsumableQuizResultMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.consumable.quiz.result
        data:
          $ref: "#/components/schemas/ConsumableQuizResult"

    GameActionAcceptedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.action.accepted
        data:
          type: object
          required: [action, bird_id, bird]
          properties:
            action:
              type: string
              enum: [place_tower, merge_tower]
            bird_id:
              type: string
              format: uuid
            bird:
              $ref: "#/components/schemas/PlacedBird"
            removed_bird_ids:
              type: array
              description: Present for successful `merge_tower`; lists consumed existing bird ids. Existing-tower merges include source and target ids, while bought-source merges include only the target id.
              items:
                type: string

    GameActionRejectedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.action.rejected
        data:
          type: object
          required: [action, error]
          properties:
            action:
              type: string
              enum: [place_tower, merge_tower, use_consumable, validate_consumable_acquire]
            error:
              type: string
              example: insufficient essence

    GameErrorMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: error
        data:
          type: object
          required: [error]
          properties:
            error:
              type: string
              example: unsupported message type

    LevelGenerationStartResult:
      type: object
      required:
        - generation_id
        - user_id
        - sub_chapter_id
        - status
        - map_status
        - quiz_status
        - map_seed
        - map_algorithm_version
        - reused
        - status_url
      properties:
        generation_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        user_id:
          type: string
          format: uuid
          description: Authenticated Supabase user id from the JWT.
        sub_chapter_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LevelGenerationOverallStatus"
        map_status:
          $ref: "#/components/schemas/LevelGenerationStepStatus"
        quiz_status:
          $ref: "#/components/schemas/LevelGenerationStepStatus"
        map_seed:
          type: integer
          format: int64
        map_algorithm_version:
          type: integer
          example: 1
        level_id:
          type: string
          format: uuid
          description: Present when an idempotent request reuses an already completed level.
        reused:
          type: boolean
          description: True when the request reused an existing generation or a saved level that already has quizzes for this user and sub-chapter.
        status_url:
          type: string
          example: /api/game-service/level-generation/0d2a8c64c36f4a7d88442a7517c9f014/status

    FreePlayStartResult:
      type: object
      required:
        - free_play_id
        - chapter_id
        - status
        - ready_quiz_count
        - queued_sub_chapters
        - total_sub_chapters
        - map_seed
        - map_algorithm_version
      properties:
        free_play_id:
          type: string
          format: uuid
          description: Chapter-scoped free play id used as the map, quiz cache, and session level key.
        chapter_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ready, preparing]
          description: "`ready` means at least one quiz was cached and the client can load free play. `preparing` means no ready sub-chapter quizzes were available yet."
        ready_quiz_count:
          type: integer
          minimum: 0
          maximum: 15
          description: Number of quizzes placed into the initial free play cache.
        queued_sub_chapters:
          type: integer
          minimum: 0
          description: Number of missing sub-chapter levels queued for normal generation.
        total_sub_chapters:
          type: integer
          minimum: 1
          description: Number of sub-chapters found in the requested chapter.
        map_seed:
          type: integer
          format: int64
        map_algorithm_version:
          type: integer
          example: 1

    LevelGenerationStatus:
      type: object
      required:
        - generation_id
        - user_id
        - sub_chapter_id
        - status
        - map_status
        - quiz_status
        - map_seed
        - map_algorithm_version
        - updated_at
      properties:
        generation_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        user_id:
          type: string
          format: uuid
        sub_chapter_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LevelGenerationOverallStatus"
        map_status:
          $ref: "#/components/schemas/LevelGenerationStepStatus"
        quiz_status:
          $ref: "#/components/schemas/LevelGenerationStepStatus"
        map_seed:
          type: integer
          format: int64
        map_algorithm_version:
          type: integer
          example: 1
        level_id:
          type: string
          format: uuid
          description: Present when `status` is `complete`.
        error:
          type: string
          description: Present when generation fails.
        updated_at:
          type: string
          format: date-time

    LevelGenerationOverallStatus:
      type: string
      enum: [pending, complete, failed]

    LevelGenerationStepStatus:
      type: string
      enum: [pending, running, complete, failed]

    GameInitialState:
      type: object
      required: [map]
      properties:
        map:
          $ref: "#/components/schemas/GeneratedMap"
        game_mode:
          type: string
          enum: [normal, free_play]
          description: Present as `free_play` for free play map loads.

    GameState:
      type: object
      description: Authoritative gameplay snapshot. After `game.session.run`, `game.state` messages are sent 20 times per second.
      required: [session_id, level_id, health, essence, wave, tick, loop_started, loop_paused, server_time, quiz_cooldown_remaining_seconds, birds, enemies, projectiles, consumables]
      properties:
        session_id:
          type: string
          format: uuid
        level_id:
          type: string
          format: uuid
        health:
          type: integer
          example: 100
        essence:
          type: integer
          example: 100
        wave:
          type: integer
          example: 0
        tick:
          type: integer
          format: int64
          example: 0
        loop_started:
          type: boolean
          description: True once `game.session.run` has started the gameplay ticker.
        loop_paused:
          type: boolean
          description: True when the server has paused the gameplay ticker and is no longer advancing ticks, enemies, combat, or wave spawning.
        server_time:
          type: string
          format: date-time
        quiz_cooldown_remaining_seconds:
          type: integer
          minimum: 0
          description: Seconds remaining in the 30-second Bird of Wisdom cooldown before the next fresh quiz can be started. Re-requesting the current unanswered quiz is not blocked by this cooldown.
          example: 12
        bird_types:
          type: array
          description: Present on `game.session.started`; lists available tower/bird types.
          items:
            $ref: "#/components/schemas/BirdTypeInfo"
        birds:
          type: array
          description: Placed birds in the current session.
          items:
            $ref: "#/components/schemas/PlacedBird"
        smogs:
          type: array
          deprecated: true
          description: Active enemies with authoritative positions and health.
          items:
            $ref: "#/components/schemas/Smog"
        enemies:
          type: array
          description: Active enemies with authoritative positions and health.
          items:
            $ref: "#/components/schemas/Enemy"
        projectiles:
          type: array
          description: Deprecated combat-visual compatibility field. Authoritative damage is resolved immediately in attack events, so this is normally empty.
          items:
            $ref: "#/components/schemas/Projectile"
        consumables:
          $ref: "#/components/schemas/ConsumableInventory"
        events:
          type: array
          description: Transient events emitted for this tick, such as attacks, damage, spawns, escapes, and wave starts.
          items:
            $ref: "#/components/schemas/GameEvent"
        game_mode:
          type: string
          enum: [normal, free_play]
          description: Session mode. Free play sessions continue waves indefinitely and never emit `game.victory`.

    GameOverState:
      type: object
      required: [session_id, level_id, health, wave, tick, reason]
      properties:
        session_id:
          type: string
          format: uuid
        level_id:
          type: string
          format: uuid
        health:
          type: integer
          example: 0
        wave:
          type: integer
          example: 3
        tick:
          type: integer
          format: int64
        reason:
          type: string
          example: health_depleted

    GameVictoryState:
      type: object
      required: [session_id, level_id, health, wave, tick, reason]
      properties:
        session_id:
          type: string
          format: uuid
        level_id:
          type: string
          format: uuid
        health:
          type: integer
          example: 40
        wave:
          type: integer
          example: 3
        tick:
          type: integer
          format: int64
        reason:
          type: string
          example: all_waves_cleared

    GamePausedState:
      type: object
      required: [session_id, level_id, tick, loop_started, loop_paused]
      properties:
        session_id:
          type: string
          format: uuid
        level_id:
          type: string
          format: uuid
        tick:
          type: integer
          format: int64
        loop_started:
          type: boolean
        loop_paused:
          type: boolean
          example: true

    GameExitedState:
      type: object
      required: [deleted, reason]
      properties:
        session_id:
          type: string
          format: uuid
        deleted:
          type: boolean
          description: Whether a Redis gameplay session was deleted.
        reason:
          type: string
          example: client_exit

    QuizPrompt:
      type: object
      description: Quiz prompt sent to the client without answer data.
      required: [quiz_id, quiz_type, question_markdown, options_markdown, remaining]
      properties:
        quiz_id:
          type: string
          format: uuid
        quiz_type:
          type: string
          enum: [mcq, true_false]
        question_markdown:
          type: string
        options_markdown:
          type: array
          items:
            type: string
        remaining:
          type: integer
          description: Number of quizzes remaining before answering this prompt.

    QuizResult:
      type: object
      required: [quiz_id, correct, selected_index, essence_awarded, remaining]
      properties:
        quiz_id:
          type: string
          format: uuid
        correct:
          type: boolean
        selected_index:
          type: integer
        essence_awarded:
          type: integer
          example: 50
        essence:
          type: integer
          description: Present when essence was awarded.
          example: 150
        remaining:
          type: integer
          description: Number of quizzes left after deleting the answered quiz.

    ConsumableQuizPrompt:
      allOf:
        - $ref: "#/components/schemas/QuizPrompt"
        - type: object
          required: [item_type]
          properties:
            item_type:
              type: string
              enum: [airstrike]

    ConsumableQuizResult:
      type: object
      required: [item_type, quiz_id, correct, selected_index, correct_index, selected_option_markdown, correct_option_markdown, consumable_awarded, consumables, remaining]
      properties:
        item_type:
          type: string
          enum: [airstrike]
        quiz_id:
          type: string
          format: uuid
        correct:
          type: boolean
        selected_index:
          type: integer
        correct_index:
          type: integer
        selected_option_markdown:
          type: string
        correct_option_markdown:
          type: string
        consumable_awarded:
          type: integer
          description: Number of consumable charges awarded by this answer.
          example: 1
        consumables:
          $ref: "#/components/schemas/ConsumableInventory"
        remaining:
          type: integer
          description: Number of quizzes left after deleting the answered quiz.

    QuizUnavailable:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [game_not_started, no_quizzes_remaining, quiz_cooldown, progression_quiz_pending, consumable_quiz_pending]
          example: no_quizzes_remaining
        retry_after_seconds:
          type: integer
          minimum: 1
          description: Present when `reason` is `quiz_cooldown`; seconds until a fresh quiz request can succeed.
          example: 20

    QuizMistakeSummary:
      type: object
      required: [level_id, count, mistakes]
      properties:
        level_id:
          type: string
          format: uuid
        count:
          type: integer
          description: Number of saved mistakes returned.
        mistakes:
          type: array
          items:
            $ref: "#/components/schemas/QuizMistake"

    QuizMistake:
      type: object
      required:
        - id
        - level_id
        - generation_id
        - quiz_id
        - quiz_index
        - quiz_type
        - question_markdown
        - options_markdown
        - answer_index
        - selected_index
        - correct_option_markdown
        - selected_option_markdown
      properties:
        id:
          type: string
          format: uuid
        level_id:
          type: string
          format: uuid
        generation_id:
          type: string
          description: Level generation id that produced the quiz.
        quiz_id:
          type: string
          format: uuid
        quiz_index:
          type: integer
        quiz_type:
          type: string
          enum: [mcq, true_false]
        question_markdown:
          type: string
        options_markdown:
          type: array
          items:
            type: string
        answer_index:
          type: integer
          description: Zero-based correct option index.
        selected_index:
          type: integer
          description: Zero-based option index chosen by the player.
        correct_option_markdown:
          type: string
        selected_option_markdown:
          type: string
        created_at:
          type: string
          format: date-time

    BirdTypeInfo:
      type: object
      required: [type, stats, attack]
      properties:
        type:
          type: string
          enum: [sparrow, woodpecker, eagle, peacock, falcon, kingfisher, phoenix, sun_god]
        stats:
          $ref: "#/components/schemas/BirdStats"
        attack:
          type: string
          enum: [single, splash, ring]
          description: Splash attacks resolve as three immediate attack lines evenly distributed across the configured spread, with two boundary lines and one center line toward the selected target. Each line damages one enemy by default, or up to the configured pierce count. Ring attacks resolve immediate damage to every enemy within the bird tower radius without selecting a target.

    PlacedBird:
      type: object
      required: [id, type, position, stats, last_fired_at_tick]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [sparrow, woodpecker, eagle, peacock, falcon, kingfisher, phoenix, sun_god]
        position:
          $ref: "#/components/schemas/GridPosition"
        stats:
          $ref: "#/components/schemas/BirdStats"
        last_fired_at_tick:
          type: integer
          format: int64

    Smog:
      type: object
      deprecated: true
      required: [id, health, position, speed, path_index]
      properties:
        id:
          type: string
          format: uuid
        health:
          type: integer
        position:
          $ref: "#/components/schemas/GridPosition"
        speed:
          type: number
          format: double
        path_index:
          type: integer

    Enemy:
      type: object
      required: [id, type, health, position, speed, path_index]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [smog, noise, junk]
        health:
          type: integer
        position:
          $ref: "#/components/schemas/GridPosition"
        speed:
          type: number
          format: double
        path_index:
          type: integer

    ConsumableInventory:
      type: object
      required: [airstrike]
      properties:
        airstrike:
          $ref: "#/components/schemas/ConsumableItemState"

    ConsumableItemState:
      type: object
      required: [status, charges, cooldown_remaining_seconds]
      properties:
        status:
          type: string
          enum: [empty, ready, quiz_pending]
          description: "`quiz_pending` means an acquisition quiz is awaiting an answer."
        charges:
          type: integer
          minimum: 0
        cooldown_remaining_seconds:
          type: integer
          minimum: 0
          description: Seconds remaining in the Airstrike cooldown. It lasts 30 seconds after Airstrike is used and 15 seconds after an acquisition quiz is answered incorrectly.
        pending_quiz_id:
          type: string
          format: uuid
          description: Present when `status=quiz_pending`; identifies the quiz that awards this consumable.

    Projectile:
      type: object
      deprecated: true
      description: Legacy projectile snapshot shape. Current authoritative combat no longer simulates projectile position or collision.
      required: [id, type, damage, projectile_speed, position, direction, remaining_range, hit_radius]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [locked, directional]
        damage:
          type: number
          format: double
        projectile_speed:
          type: number
          format: double
        position:
          $ref: "#/components/schemas/GridPosition"
        direction:
          $ref: "#/components/schemas/Vector"
        target_id:
          type: string
          format: uuid
          description: Present for locked projectiles.
        remaining_range:
          type: number
          format: double
        hit_radius:
          type: number
          format: double

    GameEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [wave.started, wave.cleared, enemy.spawned, enemy.escaped, bird.attack, enemy.damage, airstrike.impact]
        bird_id:
          type: string
          format: uuid
        enemy_id:
          type: string
          format: uuid
        smog_id:
          type: string
          format: uuid
          deprecated: true
        projectile_id:
          type: string
          format: uuid
          deprecated: true
        projectile_ids:
          type: array
          deprecated: true
          items:
            type: string
            format: uuid
        deployment_id:
          type: string
          format: uuid
          description: Present for consumable deployment events.
        item_type:
          type: string
          enum: [airstrike]
        targets:
          type: array
          description: Present for `airstrike.impact`.
          items:
            $ref: "#/components/schemas/GridPosition"
        damage:
          type: number
          format: double
        health:
          type: integer
          description: Remaining enemy health for damage events, or remaining base health for escape events.
        wave:
          type: integer

    BirdStats:
      type: object
      required: [damage, projectile_speed, fire_rate, range, cost]
      properties:
        damage:
          type: integer
        projectile_speed:
          type: number
          format: double
          deprecated: true
          description: Legacy visual projectile speed. Current backend combat resolves attacks immediately.
        fire_rate:
          type: number
          format: double
        range:
          type: number
          format: double
        spread:
          type: number
          format: double
          description: Splash attack projectile spread angle in radians. Omitted or zero uses the default splash spread.
        pierce:
          type: integer
          description: Single and splash attack hit cap per attack line. Target acquisition still uses range. When set, the attack line damages up to this many enemies. When omitted or zero, the attack line stops after its first hit.
        cost:
          type: integer

    GridPosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    Vector:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    GeneratedMap:
      type: object
      required: [version, seed, width, height, enemy_path, objects]
      properties:
        version:
          type: integer
          example: 1
        seed:
          type: integer
          format: int64
        width:
          type: integer
          example: 18
        height:
          type: integer
          example: 12
        enemy_path:
          type: array
          description: Ordered path tiles from the enemy spawn edge to the exit edge.
          items:
            $ref: "#/components/schemas/PathTile"
        objects:
          type: array
          description: Decorative or blocking map objects generated outside the enemy path and its one-tile placement buffer.
          items:
            $ref: "#/components/schemas/MapObject"

    PathTile:
      type: object
      required: [x, y, kind]
      properties:
        x:
          type: integer
          minimum: 0
          maximum: 17
        y:
          type: integer
          minimum: 0
          maximum: 11
        kind:
          type: string
          enum: [start, end, straight, turn]
        from:
          $ref: "#/components/schemas/GridDirection"
        to:
          $ref: "#/components/schemas/GridDirection"
        axis:
          type: string
          enum: [horizontal, vertical]
          description: Present on straight path tiles.
        turn:
          type: string
          enum: [left, right]
          description: Present on turn path tiles.

    GridDirection:
      type: string
      enum: [north, east, south, west]

    MapObject:
      type: object
      required: [type, x, y]
      properties:
        type:
          type: string
          enum: [tree, tree_stump, bush, rock]
        x:
          type: integer
          minimum: 0
          maximum: 17
        y:
          type: integer
          minimum: 0
          maximum: 11
