        data:
          $ref: "#/components/schemas/GameOverState"

    GameVictoryMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          const: game.victory
        data:
          $ref: "#/components/schemas/GameVictoryState"

    GamePausedMessage:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
