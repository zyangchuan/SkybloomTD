openapi: 3.1.0
info:
  title: SkyBloomTD Edge API
  version: 0.1.0
  description: |
    Public API exposed through the Nginx reverse proxy.

    Only the reverse proxy publishes a host port. Backend services are private
    Docker-network services and should be accessed through these paths.

    Protected backend routes require a Supabase JWT in the `Authorization`
    header. Nginx verifies the token through `user-service /auth/verify` and
    forwards trusted identity headers to private services.
servers:
  - url: http://localhost
    description: Local Docker Compose reverse proxy
tags:
  - name: System
    description: Public health and documentation endpoints.
  - name: Auth
    description: Authentication verification endpoints.
  - name: Users
    description: User profile persistence backed by `private.users`.
  - name: Document Content
    description: PDF/document upload and OCR workflow entrypoints.
  - name: Level Generator
    description: Level generation workflow entrypoints.

paths:
  /nginx-health:
    get:
      tags: [System]
      summary: Check reverse proxy health
      operationId: getNginxHealth
      security: []
      responses:
        "200":
          description: Reverse proxy is healthy.
          content:
            text/plain:
              schema:
                type: string
              example: ok

  /openapi.yaml:
    get:
      tags: [System]
      summary: Download this OpenAPI document
      operationId: getOpenApiDocument
      security: []
      responses:
        "200":
          description: OpenAPI YAML document.
          content:
            application/yaml:
              schema:
                type: string

  /api/user-service/health:
    get:
      tags: [System]
      summary: Check user-service process health
      operationId: getUserServiceHealth
      security: []
      responses:
        "200":
          description: Service process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/user-service/ready:
    get:
      tags: [System]
      summary: Check user-service database readiness
      operationId: getUserServiceReadiness
      security: []
      responses:
        "200":
          description: Service can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/user-service/auth/verify:
    get:
      tags: [Auth]
      summary: Verify a Supabase JWT
      description: |
        Stateless token verification endpoint used by Nginx `auth_request`.
        Clients generally do not need to call this directly.
      operationId: verifySupabaseJwt
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Token is valid.
          headers:
            X-User-Id:
              description: Authenticated Supabase user id from the JWT `sub` claim.
              schema:
                type: string
                format: uuid
            X-User-Email:
              description: User email from the JWT, when present.
              schema:
                type: string
                format: email
        "401":
          description: Token is missing, invalid, expired, or misconfigured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users:
    post:
      tags: [Users]
      summary: Create or update the authenticated user profile
      description: |
        Stores the authenticated Supabase user in `private.users`. The database
        user id is always taken from the JWT `sub` claim. If `id` is included in
        the body, it must match the JWT subject.
      operationId: upsertUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserRequest"
            example:
              user_name: Ada
              email: ada@example.com
              metadata:
                avatar_url: https://example.com/avatar.png
      responses:
        "200":
          description: User profile was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request body id does not match authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/me:
    post:
      tags: [Users]
      summary: Create or update the authenticated user profile
      description: Alias of `POST /api/users`.
      operationId: upsertCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserRequest"
      responses:
        "200":
          description: User profile was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request body id does not match authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/upload-file:
    post:
      tags: [Document Content]
      summary: Upload a document for OCR and indexing
      description: |
        Shortcut route for `POST /api/document-content/upload-file`.

        The authenticated user id is taken from the Supabase JWT. Do not send a
        `user_id` field; client-supplied user ids are ignored by the backend.
      operationId: uploadDocumentShortcut
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadDocumentRequest"
      responses:
        "200":
          description: OCR/indexing workflow was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDocumentResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid multipart upload or missing `file`/`game_name` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Uploaded file exceeds proxy size limit.
        "500":
          description: Source storage or document row creation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Task status recording or RabbitMQ enqueue failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/upload-file:
    post:
      tags: [Document Content]
      summary: Upload a document for OCR and indexing
      description: |
        Queues the OCR/indexing workflow. The API creates a durable document
        row immediately with `is_ready = false`, stores the main task status in
        Redis as `queued`, and publishes the worker job to RabbitMQ.
      operationId: uploadDocument
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadDocumentRequest"
      responses:
        "200":
          description: OCR/indexing workflow was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDocumentResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid multipart upload or missing `file`/`game_name` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Uploaded file exceeds proxy size limit.
        "500":
          description: Source storage or document row creation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Task status recording or RabbitMQ enqueue failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/documents:
    get:
      tags: [Document Content]
      summary: List current user's documents
      description: |
        Returns durable document rows for the authenticated user. Each item
        includes `is_ready` for durable usability and `task_id` for polling
        temporary Redis task status while processing is still in progress.
      operationId: listCurrentUserDocuments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDocumentsResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/documents/{document_id}:
    delete:
      tags: [Document Content]
      summary: Delete a document and generated content
      description: |
        Deletes a document owned by the authenticated user. The service removes
        S3/local document assets, generated quizzes/levels for the document,
        document chunks/sections, and the document row.
      operationId: deleteDocument
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Document and generated content were deleted.
        "400":
          description: Invalid document id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Asset deletion or database deletion failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/documents/{document_id}/chapters:
    get:
      tags: [Document Content]
      summary: List chapters for a document
      description: |
        Returns indexed chapters for a document owned by the authenticated user.
        A document that is not ready yet may return an empty chapter list.
      operationId: listDocumentChapters
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document chapters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChaptersResponse"
        "400":
          description: Invalid document id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/chapters/{chapter_id}/sub-chapters:
    get:
      tags: [Document Content]
      summary: List sub-chapters for a chapter
      description: Returns indexed sub-chapters for a chapter owned by the authenticated user.
      operationId: listChapterSubChapters
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: Chapter sub-chapters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSubChaptersResponse"
        "400":
          description: Invalid chapter id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Chapter was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/document-content/tasks/{task_id}/status:
    get:
      tags: [Document Content]
      summary: Get document processing task status
      description: |
        Reads the temporary Redis task status for a document processing job.
        Status records expire after the configured task-status TTL, which is
        seven days by default. If the Redis key has expired, use the document
        `is_ready` flag as the durable readiness signal.
      operationId: getDocumentTaskStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task status was found in Redis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task status was not found or has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Redis status lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/generate_level:
    get:
      tags: [Level Generator]
      summary: Queue level generation for a sub-chapter
      description: Shortcut route for `GET /api/level-generator/generate_level`.
      operationId: generateLevelShortcutGet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SubChapterId"
      responses:
        "200":
          description: Level generation workflow was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateLevelResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid sub-chapter id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastApiValidationError"
    post:
      tags: [Level Generator]
      summary: Queue level generation for a sub-chapter
      description: Shortcut route for `POST /api/level-generator/generate_level`.
      operationId: generateLevelShortcutPost
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SubChapterId"
      responses:
        "200":
          description: Level generation workflow was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateLevelResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid sub-chapter id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastApiValidationError"

  /api/level-generator/health:
    get:
      tags: [Level Generator]
      summary: Check level-generator API health through the protected proxy route
      operationId: getLevelGeneratorHealth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Level-generator API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/level-generator/generate_level:
    get:
      tags: [Level Generator]
      summary: Queue level generation for a sub-chapter
      operationId: generateLevelGet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SubChapterId"
      responses:
        "200":
          description: Level generation workflow was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateLevelResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid sub-chapter id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastApiValidationError"
    post:
      tags: [Level Generator]
      summary: Queue level generation for a sub-chapter
      operationId: generateLevelPost
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SubChapterId"
      responses:
        "200":
          description: Level generation workflow was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateLevelResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid sub-chapter id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastApiValidationError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT

  parameters:
    SubChapterId:
      name: sub_chapter_id
      in: query
      required: true
      description: UUID of the indexed sub-chapter to generate a level for.
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      description: Main document processing task id returned by upload.
      schema:
        type: string
        pattern: "^[a-f0-9]{32}$"
    DocumentId:
      name: document_id
      in: path
      required: true
      description: Document id returned by upload or document listing.
      schema:
        type: string
        format: uuid
    ChapterId:
      name: chapter_id
      in: path
      required: true
      description: Chapter id returned by the document chapters endpoint.
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ready

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: authentication required

    FastApiValidationError:
      type: object
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true

    UpsertUserRequest:
      type: object
      required: [user_name]
      properties:
        id:
          type: string
          format: uuid
          description: Optional. If provided, must match the JWT `sub` claim.
        email:
          type: string
          format: email
        user_name:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties: true

    User:
      type: object
      required: [id, user_name, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        user_name:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UploadDocumentRequest:
      type: object
      required: [file, game_name]
      properties:
        file:
          type: string
          format: binary
          description: Document file to OCR. PDFs are expected by the current worker flow.
        game_name:
          type: string
          maxLength: 120
          description: User-facing game name generated from this document.
          example: Linear Algebra TD

    UploadDocumentResponse:
      type: object
      required:
        - message
        - task_id
        - ocr_task_id
        - upload_task_id
        - index_task_id
        - user_id
        - document_id
        - game_name
        - is_ready
      properties:
        message:
          type: string
          example: Upload file success
        task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
          description: Main document processing task id. Poll this id through the task status endpoint.
        ocr_task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        upload_task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        index_task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        user_id:
          type: string
          format: uuid
          description: Authenticated Supabase user id from the JWT.
        document_id:
          type: string
          format: uuid
          description: Generated document id. The document row exists immediately with `is_ready = false`.
        game_name:
          type: string
          description: User-facing game name stored on the document row.
          example: Linear Algebra TD
        is_ready:
          type: boolean
          description: Durable document readiness flag. It is `false` until indexing succeeds.
          example: false

    ListDocumentsResponse:
      type: object
      required:
        - documents
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSummary"

    DocumentSummary:
      type: object
      required:
        - document_id
        - filename
        - game_name
        - is_ready
        - task_id
        - created_at
        - updated_at
      properties:
        document_id:
          type: string
          format: uuid
        filename:
          type: string
          example: lesson.pdf
        game_name:
          type: string
          example: Linear Algebra TD
        is_ready:
          type: boolean
          description: Durable document readiness flag. `true` only after indexing succeeds.
        task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
          description: Main document processing task id.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListChaptersResponse:
      type: object
      required:
        - chapters
      properties:
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/ChapterSummary"

    ChapterSummary:
      type: object
      required:
        - chapter_id
        - document_id
        - chapter_index
        - title
        - start_line
        - end_line
        - created_at
      properties:
        chapter_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        chapter_index:
          type:
            - integer
            - "null"
        title:
          type:
            - string
            - "null"
          example: Linear transformations
        start_line:
          type:
            - integer
            - "null"
        end_line:
          type:
            - integer
            - "null"
        created_at:
          type: string
          format: date-time

    ListSubChaptersResponse:
      type: object
      required:
        - sub_chapters
      properties:
        sub_chapters:
          type: array
          items:
            $ref: "#/components/schemas/SubChapterSummary"

    SubChapterSummary:
      type: object
      required:
        - sub_chapter_id
        - document_id
        - chapter_id
        - sub_chapter_index
        - title
        - start_line
        - end_line
        - created_at
      properties:
        sub_chapter_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        sub_chapter_index:
          type:
            - integer
            - "null"
        title:
          type:
            - string
            - "null"
          example: Matrix representation
        start_line:
          type:
            - integer
            - "null"
        end_line:
          type:
            - integer
            - "null"
        created_at:
          type: string
          format: date-time

    TaskStatusResponse:
      type: object
      required:
        - task_id
        - document_id
        - status
        - error
        - updated_at
      properties:
        task_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        document_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, successful, failed]
          description: Temporary Redis task status.
        error:
          type:
            - string
            - "null"
          description: Failure details when `status` is `failed`; otherwise `null`.
        updated_at:
          type: string
          format: date-time

    GenerateLevelResponse:
      type: object
      required:
        - message
        - task_id
        - fetch_task_id
        - generate_task_id
        - user_id
        - sub_chapter_id
      properties:
        message:
          type: string
          example: Level generation started
        task_id:
          type: string
          description: Celery chain result id.
        fetch_task_id:
          type: string
        generate_task_id:
          type: string
        user_id:
          type: string
