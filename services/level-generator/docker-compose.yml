services:
  level-generator-api:
    container_name: level-generator-api
    build:
      context: ./src/api
      dockerfile: Dockerfile
    image: level-generator-api:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL:?Set RABBITMQ_URL to the external RabbitMQ broker URL}
      - LEVEL_GENERATOR_QUEUE=${LEVEL_GENERATOR_QUEUE:-level.generate}

  level-generator-worker:
    container_name: level-generator-worker
    hostname: level-generator-worker
    build:
      context: ./src/worker
      dockerfile: Dockerfile
    image: level-generator-worker:latest
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL:?Set RABBITMQ_URL to the external RabbitMQ broker URL}
      - LEVEL_GENERATOR_QUEUE=${LEVEL_GENERATOR_QUEUE:-level.generate}
      - DOCUMENT_CONTENT_GRPC_ADDR=host.docker.internal:50051
    extra_hosts:
      - "host.docker.internal:host-gateway"
