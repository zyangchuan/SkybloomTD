services:
  document-content-worker:
    container_name: document-content-worker
    hostname: document-content-worker
    build:
      context: ./src/worker
      dockerfile: Dockerfile
    image: document-content-worker:latest
    command: python -m app.rabbitmq_worker
    env_file:
      - ../../.env.local
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DOCUMENT_CONTENT_QUEUE: ${DOCUMENT_CONTENT_QUEUE:-document.process}
      REDIS_URL: redis://redis:6379/0
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./src/worker:/app
      - ./output:/output
      - ./temp:/temp
      - models:/root/.paddlex
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib
    depends_on:
      - rabbitmq
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    restart: unless-stopped

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  models:
  rabbitmq-data:
  redis-data:
