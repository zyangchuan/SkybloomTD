services:
  reverse-proxy:
    env_file:
      - ./.env.local

  frontend:
    command: npm run dev
    env_file:
      - ./.env.local
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
      - /app/.next

  game:
    command: npm run dev
    env_file:
      - ./.env.local
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/game:/app
      - /app/node_modules

  document-content-api:
    env_file:
      - ./.env.local
    networks:
      - services-network

  document-content-grpc:
    env_file:
      - ./.env.local

  document-content-worker:
    container_name: document-content-worker
    hostname: document-content-worker
    build:
      context: ./services/document-content/src/worker
      dockerfile: Dockerfile
    image: document-content-worker:latest
    command: python -m app.rabbitmq_worker
    env_file:
      - ./.env.local
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./services/document-content/src/worker:/app
      - ./services/document-content/output:/output
      - ./services/document-content/temp:/temp
      - models:/root/.paddlex
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - services-network

  game-service:
    env_file:
      - ./.env.local

  game-generation-worker:
    env_file:
      - ./.env.local

  user-service:
    env_file:
      - ./.env.local

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    ports:
      - "6379:6379"

volumes:
  models:
