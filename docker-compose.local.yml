services:
  reverse-proxy:
    env_file:
      - ./.env.local

  frontend:
    command: npm run dev
    env_file:
      - ./.env.local
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
      - /app/.next

  game:
    command: npm run dev
    env_file:
      - ./.env.local
    ports:
      - "${GAME_CLIENT_PORT:-5173}:5173"
    volumes:
      - ./frontend/game:/app
      - /app/node_modules

  document-content-api:
    env_file:
      - ./.env.local
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - services-network

  document-content-grpc:
    env_file:
      - ./.env.local
    depends_on:
      - redis

  document-content-worker:
    container_name: document-content-worker
    hostname: document-content-worker
    build:
      context: ./services/document-content/src/worker
      dockerfile: Dockerfile
    image: document-content-worker:latest
    command: python -m app.rabbitmq_worker
    env_file:
      - ./.env.local
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./services/document-content/src/worker:/app
      - ./services/document-content/output:/output
      - ./services/document-content/temp:/temp
      - models:/root/.paddlex
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - services-network

  game-service:
    env_file:
      - ./.env.local
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      GAME_STATUS_REDIS_URL: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      game-redis:
        condition: service_started

  game-generation-worker:
    env_file:
      - ./.env.local
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      GAME_STATUS_REDIS_URL: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      document-content-grpc:
        condition: service_healthy
      game-redis:
        condition: service_started

  user-service:
    env_file:
      - ./.env.local

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - services-network

  redis:
    container_name: redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - services-network

volumes:
  rabbitmq-data:
  redis-data:
  models:
