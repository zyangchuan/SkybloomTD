name: Build OCR Worker Image

on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - runpod-ocr-pipeline
    paths:
      - "services/document-content/src/worker/ocr_worker/**"
      - ".github/workflows/build-ocr-worker-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/zyangchuan/skybloomtd/ocr-worker

jobs:
  build:
    name: Build and push OCR worker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/document-content/src/worker
          file: services/document-content/src/worker/ocr_worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image tags
        run: |
          echo "Pushed:"
          echo "${IMAGE_NAME}:latest"
