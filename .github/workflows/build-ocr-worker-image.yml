name: Build OCR Worker Image

on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - runpod-ocr-pipeline
    paths:
      - "services/document-content/src/worker/ocr_worker/**"
      - ".github/workflows/build-ocr-worker-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/zyangchuan/skybloomtd/ocr-worker

jobs:
  build:
    name: Build and push OCR worker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --pull \
            --progress=plain \
            -f services/document-content/src/worker/ocr_worker/Dockerfile \
            -t "${IMAGE_NAME}:latest" \
            services/document-content/src/worker

      - name: Push image
        run: docker push "${IMAGE_NAME}:latest"

      - name: Print image tags
        run: |
          echo "Pushed:"
          echo "${IMAGE_NAME}:latest"
