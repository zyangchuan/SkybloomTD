name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go-tests:
    name: Go tests (${{ matrix.module }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - services/user-service
          - services/document-content/src/api
          - services/document-content/src/grpc
          - services/game-service/src

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  python-tests:
    name: Python tests (${{ matrix.module }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - services/document-content/src/worker

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: python3 -m unittest discover -s tests
