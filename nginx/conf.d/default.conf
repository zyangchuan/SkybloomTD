map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s ipv6=off;

    set $frontend http://frontend:3000;
    set $game http://game:5173;
    set $user_service http://user-service:8080;
    set $document_content_api http://document-content-api:8000;
    set $game_service http://game-service:8081;

    client_max_body_size 100m;
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header X-Authenticated-User-Id "";
    proxy_set_header X-Authenticated-User-Email "";
    proxy_set_header X-Authenticated-By "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    auth_request_set $auth_user_id $upstream_http_x_user_id;
    auth_request_set $auth_user_email $upstream_http_x_user_email;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /openapi.yaml {
        default_type application/yaml;
        alias /usr/share/nginx/html/docs/openapi.yaml;
    }

    location = /docs {
        default_type text/html;
        alias /usr/share/nginx/html/docs/swagger-ui.html;
    }

    location = /docs/ {
        default_type text/html;
        alias /usr/share/nginx/html/docs/swagger-ui.html;
    }

    location = /_auth {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URI $request_uri;
        rewrite ^ /auth/verify break;
        proxy_pass $user_service;
    }

    location @auth_required {
        add_header Content-Type application/json;
        return 401 '{"error":"authentication required"}';
    }

    location = /api/users {
        rewrite ^ /users break;
        proxy_pass $user_service;
    }

    location ^~ /api/users/ {
        rewrite ^/api/users/(.*)$ /users/$1 break;
        proxy_pass $user_service;
    }

    location = /api/user-service {
        return 308 /api/user-service/;
    }

    location ^~ /api/user-service/ {
        rewrite ^/api/user-service/(.*)$ /$1 break;
        proxy_pass $user_service;
    }

    location = /api/upload-file {
        auth_request /_auth;
        error_page 401 403 = @auth_required;
        proxy_set_header X-Authenticated-User-Id $auth_user_id;
        proxy_set_header X-Authenticated-User-Email $auth_user_email;
        proxy_set_header X-Authenticated-By reverse-proxy;
        rewrite ^ /upload-file break;
        proxy_pass $document_content_api;
    }

    location = /api/document-content {
        return 308 /api/document-content/;
    }

    location ^~ /api/document-content/ {
        auth_request /_auth;
        error_page 401 403 = @auth_required;
        proxy_set_header X-Authenticated-User-Id $auth_user_id;
        proxy_set_header X-Authenticated-User-Email $auth_user_email;
        proxy_set_header X-Authenticated-By reverse-proxy;
        rewrite ^/api/document-content/(.*)$ /$1 break;
        proxy_pass $document_content_api;
    }

    location = /api/game-service {
        return 308 /api/game-service/;
    }

    location ^~ /api/game-service/ {
        auth_request /_auth;
        error_page 401 403 = @auth_required;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Authenticated-User-Id $auth_user_id;
        proxy_set_header X-Authenticated-User-Email $auth_user_email;
        proxy_set_header X-Authenticated-By reverse-proxy;
        rewrite ^/api/game-service/(.*)$ /$1 break;
        proxy_pass $game_service;
    }

    location /game/ {
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_pass $game;
    }

    location / {
        proxy_pass $frontend;
    }
}
